function openStatsPanel(){const overlay=document.getElementById('statsOverlay');const himAvatar=document.getElementById('statsAvatarHim');const meAvatar=document.getElementById('statsAvatarMe');if(aboutHim.avatar){himAvatar.style.backgroundImage=`url(${aboutHim.avatar})`;himAvatar.style.backgroundSize='cover';himAvatar.style.backgroundPosition='center'}else{himAvatar.style.backgroundImage='';himAvatar.style.backgroundColor='var(--mist-light)'}if(aboutMe.avatar){meAvatar.style.backgroundImage=`url(${aboutMe.avatar})`;meAvatar.style.backgroundSize='cover';meAvatar.style.backgroundPosition='center'}else{meAvatar.style.backgroundImage='';meAvatar.style.backgroundColor='var(--mist-purple)'}const body=document.getElementById('statsBody');const annDate=new Date(aboutHim.anniversaryDate+'T00:00:00');const now=new Date();const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());const daysTogether=Math.floor((today-annDate)/(1000*60*60*24));const annYear=annDate.getFullYear();const annMonth=annDate.getMonth()+1;const annDay=annDate.getDate();const myMsg=messages.filter(m=>m.role==='user').length;const hisMsg=messages.filter(m=>m.role==='partner').length;const chatDays=new Set(messages.filter(m=>m.role==='user'||m.role==='partner').map(m=>new Date(m.timestamp).toDateString())).size;const missedCalls=totalCallCount-answeredCallCount;const totalDuration=totalCallDuration;const maxDuration=maxCallDuration;const callMessages=messages.filter(m=>m.type==='call');const recentCall=callMessages.length>0?callMessages[callMessages.length-1]:null;let recentText='暂无';if(recentCall){const rd=new Date(recentCall.timestamp);const timeStr=`${rd.getMonth()+1}月${rd.getDate()}日 ${String(rd.getHours()).padStart(2,'0')}:${String(rd.getMinutes()).padStart(2,'0')}`;if(recentCall.content.includes('通话结束'))recentText=`已接通 · ${timeStr}`;else recentText=`未接/被拒 · ${timeStr}`}function fmtDuration(sec){if(sec<60)return sec+'秒';if(sec<3600)return Math.floor(sec/60)+'分'+sec%60+'秒';const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60);return h+'时'+m+'分'}function getHisTopWords(msgs,count){const freq={};msgs.filter(m=>m.type==='text'&&m.content).forEach(m=>{cardLibrary.forEach(card=>{if(m.content.includes(card)){freq[card]=freq[card]?freq[card]+1:1}})});const sorted=Object.entries(freq).sort((a,b)=>b[1]-a[1]);return sorted.slice(0,count)}function getMyTopWords(msgs,count){const freq={};msgs.filter(m=>m.type==='text'&&m.content).forEach(m=>{freq[m.content]=freq[m.content]?freq[m.content]+1:1});const sorted=Object.entries(freq).sort((a,b)=>b[1]-a[1]);return sorted.slice(0,count)}const hisWords=getHisTopWords(messages.filter(m=>m.role==='partner'),10);const myWords=getMyTopWords(messages.filter(m=>m.role==='user'),10);const hisWordColors=['rgba(180,210,240,0.45)','rgba(160,220,230,0.45)','rgba(170,200,245,0.45)','rgba(190,215,235,0.45)','rgba(175,225,220,0.45)','rgba(185,205,240,0.45)','rgba(165,230,225,0.45)','rgba(195,210,230,0.45)','rgba(155,215,240,0.45)','rgba(188,220,238,0.45)'];const myWordColors=['rgba(240,200,210,0.45)','rgba(235,190,220,0.45)','rgba(245,210,200,0.45)','rgba(230,195,225,0.45)','rgba(240,205,215,0.45)','rgba(235,185,210,0.45)','rgba(250,215,205,0.45)','rgba(225,200,230,0.45)','rgba(245,195,220,0.45)','rgba(238,208,218,0.45)'];let hisWordsHTML='';hisWords.forEach((w,i)=>{hisWordsHTML+=`<div class="stats-word-card" style="background:${hisWordColors[i]}"><span class="sw-rank">${i+1}.</span><span class="sw-word">${w[0]}</span><span class="sw-count">${w[1]}次</span></div>`});let myWordsHTML='';myWords.forEach((w,i)=>{myWordsHTML+=`<div class="stats-word-card" style="background:${myWordColors[i]}"><span class="sw-rank">${i+1}.</span><span class="sw-word">${w[0]}</span><span class="sw-count">${w[1]}次</span></div>`});if(!hisWordsHTML)hisWordsHTML='<div style="text-align:center;color:#a7a9be;font-size:0.75rem;padding:10px">暂无数据</div>';if(!myWordsHTML)myWordsHTML='<div style="text-align:center;color:#a7a9be;font-size:0.75rem;padding:10px">暂无数据</div>';const spaceDays=spaceActivated?getSpaceDays():0;const spaceDynCount=spaceDynamics.length;const spaceCheckinBoth=spaceActivated?((myCheckInDate===getTodayStr()&&partnerCheckInDate===getTodayStr())?'今日已共同打卡':'今日未共同打卡'):'空间未激活';const spaceActiveDateStr=spaceActivated?(()=>{const ad=new Date(spaceActivatedDate+'T00:00:00');return`${ad.getFullYear()}年${ad.getMonth()+1}月${ad.getDate()}日`})():'未激活';body.innerHTML=`<div class="stats-highlight-days"><div class="shd-big">${daysTogether}</div><div class="shd-since">♡ 相识天数 · 从${annYear}年${annMonth}月${annDay}日开始</div></div><div class="stats-section-title">聊天统计</div><div class="stats-row"><span class="stats-label">总消息</span><span class="stats-value">${totalMessageCount}</span></div><div class="stats-row"><span class="stats-label">我发的</span><span class="stats-value">${myMsg}</span></div><div class="stats-row"><span class="stats-label">他发的</span><span class="stats-value">${hisMsg}</span></div><div class="stats-row"><span class="stats-label">互动天数</span><span class="stats-value">${chatDays}</span></div><div class="stats-section-title">视频通话统计</div><div class="stats-call-row"><span class="scr-label">通话总次数</span><span class="scr-value">${totalCallCount}</span></div><div class="stats-call-row"><span class="scr-label">接通次数</span><span class="scr-value">${answeredCallCount}</span></div><div class="stats-call-row"><span class="scr-label">未接 / 被拒</span><span class="scr-value">${missedCalls}</span></div><div class="stats-call-row"><span class="scr-label">总通话时长</span><span class="scr-value">${fmtDuration(totalDuration)}</span></div><div class="stats-call-row"><span class="scr-label">最长通话</span><span class="scr-value">${fmtDuration(maxDuration)}</span></div><div class="stats-call-row"><span class="scr-label">最近通话</span><span class="scr-value">${recentText}</span></div><div class="stats-section-title">恋人空间</div><div class="stats-row"><span class="stats-label">激活日期</span><span class="stats-value">${spaceActiveDateStr}</span></div><div class="stats-row"><span class="stats-label">已开启</span><span class="stats-value">${spaceDays} 天</span></div><div class="stats-row"><span class="stats-label">共同打卡</span><span class="stats-value">${spaceCheckinBoth}</span></div><div class="stats-row"><span class="stats-label">空间动态</span><span class="stats-value">${spaceDynCount} 条</span></div><div class="stats-section-title">高频词汇 TOP10</div><div class="stats-words-wrap"><div class="stats-words-col"><div class="swc-title">他的高频词</div>${hisWordsHTML}</div><div class="stats-words-col"><div class="swc-title">我的高频词</div>${myWordsHTML}</div></div>`;overlay.classList.add('show')}
function bindStatsEvents(){document.getElementById('statsOverlay').addEventListener('click',function(e){if(e.target===this)this.classList.remove('show')})}

/* ===== 全局悬浮球 ===== */
let fabLongPressTimer=null;
function renderGlobalFab(){const fab=document.getElementById('globalFab');if(!fabSettings.visible){fab.classList.add('hidden');return}fab.classList.remove('hidden');const size=fabSettings.size||52;fab.style.width=size+'px';fab.style.height=size+'px';if(fabSettings.x!==null){fab.style.right='auto';fab.style.bottom='auto';fab.style.left=fabSettings.x+'px';fab.style.top=fabSettings.y+'px'}if(fabSettings.icon){fab.style.backgroundImage=`url(${fabSettings.icon})`;fab.style.backgroundSize='cover';fab.style.backgroundPosition='center';fab.style.backgroundColor='transparent';fab.style.borderRadius='50%';fab.style.overflow='hidden';fab.classList.add('has-image');const defaultIcon=fab.querySelector('.fab-default-icon');if(defaultIcon)defaultIcon.style.display='none'}else{fab.style.backgroundImage='';if(spaceActivated){fab.style.backgroundColor='rgba(255,180,200,0.85)'}else{fab.style.backgroundColor='rgba(107,94,122,0.85)'}fab.classList.remove('has-image');const defaultIcon=fab.querySelector('.fab-default-icon');if(defaultIcon)defaultIcon.style.display=''}}
function toggleGlobalFab(){fabSettings.visible=!fabSettings.visible;dbSet('fabSettings',fabSettings);renderGlobalFab();if(fabSettings.visible){showAlert('提示','悬浮球已显示')}else{showAlert('提示','悬浮球已隐藏')}}
function bindFabEvents(){const fab=document.getElementById('globalFab');const menu=document.getElementById('fabContextMenu');fab.addEventListener('touchstart',e=>{fabLongPressTimer=setTimeout(()=>{showFabContextMenu(e)},600)});fab.addEventListener('touchend',()=>{if(fabLongPressTimer)clearTimeout(fabLongPressTimer)});fab.addEventListener('touchmove',()=>{if(fabLongPressTimer)clearTimeout(fabLongPressTimer)});fab.addEventListener('click',e=>{if(fabLongPressTimer)clearTimeout(fabLongPressTimer);if(menu.classList.contains('show'))return});document.addEventListener('click',e=>{if(!menu.contains(e.target)&&e.target!==fab){menu.classList.remove('show')}});menu.querySelector('[data-action="changeIcon"]').onclick=()=>{menu.classList.remove('show');document.getElementById('fabIconInput').click()};menu.querySelector('[data-action="hideFab"]').onclick=()=>{menu.classList.remove('show');fabSettings.visible=!1;dbSet('fabSettings',fabSettings);renderGlobalFab()};document.getElementById('fabIconInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async ev=>{fabSettings.icon=ev.target.result;await dbSet('fabSettings',fabSettings);renderGlobalFab()};r.readAsDataURL(f);e.target.value=''};makeFabDraggable(fab)}
function showFabContextMenu(e){const menu=document.getElementById('fabContextMenu');const t=e.touches?e.touches[0]:e;menu.style.left=t.clientX-70+'px';menu.style.top=t.clientY-80+'px';menu.classList.add('show')}
function makeFabDraggable(el){let startX,startY,startLeft,startTop,dragging=!1,hasMoved=!1;const onStart=e=>{dragging=!0;hasMoved=!1;const t=e.touches?e.touches[0]:e;startX=t.clientX;startY=t.clientY;const rect=el.getBoundingClientRect();startLeft=rect.left;startTop=rect.top;el.style.transition='none';el.style.animation='none'};const onMove=e=>{if(!dragging)return;const t=e.touches?e.touches[0]:e;const dx=t.clientX-startX,dy=t.clientY-startY;if(Math.abs(dx)>3||Math.abs(dy)>3)hasMoved=!0;el.style.left=(startLeft+dx)+'px';el.style.top=(startTop+dy)+'px';el.style.right='auto';el.style.bottom='auto'};const onEnd=()=>{dragging=!1;el.style.transition='';el.style.animation='fabPulse 2.5s ease-in-out infinite';if(hasMoved){fabSettings.x=parseInt(el.style.left);fabSettings.y=parseInt(el.style.top);dbSet('fabSettings',fabSettings)}};el.addEventListener('touchstart',onStart,{passive:!1});document.addEventListener('touchmove',onMove,{passive:!1});document.addEventListener('touchend',onEnd)}

document.getElementById('hiddenFileInput').addEventListener('change',handleImageUpload);
document.getElementById('hiddenCameraInput').addEventListener('change',handleImageUpload);
document.addEventListener('DOMContentLoaded',init);
