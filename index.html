<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>易遇♡雾凉</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--mist-gray:#a7a9be;--mist-purple:#6b5e7a;--mist-light:#c4bbd1;--bg-light:#f3f0f7;--text-dark:#3a3440;--heart-red:#e04b4b;--white:#fff;--border-light:rgba(196,187,209,0.25);--exchange-orange:#e0886e}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;font-weight:400;background:#faf9fb;color:var(--text-dark);width:100vw;height:100vh;height:100dvh;overflow:hidden;user-select:none;-webkit-user-select:none;position:relative}
.app-container{display:flex;flex-direction:column;width:100%;height:100%;position:relative;z-index:1}
.desktop-bg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;background-repeat:no-repeat}
.header-bar{display:flex;align-items:center;justify-content:center;padding:8px 16px;min-height:52px;flex-shrink:0;background:transparent;position:relative;z-index:10}
.header-avatars{display:flex;flex-direction:column;align-items:center}
.avatar-row{display:flex;align-items:center;gap:0}
.avatar-him,.avatar-me{width:40px;height:40px;border-radius:50%;flex-shrink:0;object-fit:cover;background:var(--mist-light)}
.avatar-me{background:var(--mist-purple)}
.header-nickname{font-size:0.75rem;color:var(--mist-purple);text-align:center;margin-top:2px;font-weight:400}
.love-points-display{font-size:0.7rem;color:#e04b4b;margin-left:4px;font-weight:500}
.page{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;display:none;position:relative;z-index:1}
.page.active{display:flex;flex-direction:column}
.nav-bar{display:flex;flex-shrink:0;background:transparent;border-top:1px solid rgba(196,187,209,0.15);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:10}
.nav-item{flex:1;text-align:center;padding:12px 0;font-size:0.9rem;letter-spacing:0.5em;color:var(--mist-gray);cursor:pointer;transition:color 0.2s;font-weight:400;background:transparent;border:none;font-family:inherit}
.nav-item.active{color:var(--mist-purple)}
.chat-area{flex:1;overflow-y:auto;padding:8px 12px}
.message-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:14px;position:relative;transition:background 0.3s}
.message-row.partner{justify-content:flex-start}
.message-row.me{justify-content:flex-end}
.message-row.system{justify-content:center}
.msg-avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;object-fit:cover;background:var(--mist-light)}
.msg-avatar.me{background:var(--mist-purple)}
.msg-content{display:flex;flex-direction:column;max-width:85%}
.msg-content.partner{align-items:flex-start}
.msg-content.me{align-items:flex-end}
.msg-content.system{align-items:center;max-width:100%}
.bubble{padding:10px 14px;font-size:0.95rem;line-height:1.5;word-break:break-word;width:fit-content;max-width:100%;border-radius:20px}
.bubble-partner{background:rgba(255,255,255,0.45);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border:1px solid rgba(255,255,255,0.6);border-radius:20px;box-shadow:0 4px 24px rgba(107,94,122,0.06),inset 0 1px 0 rgba(255,255,255,0.5);color:var(--text-dark)}
.bubble-me{background:rgba(107,94,122,0.18);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border:1px solid rgba(255,255,255,0.5);border-radius:20px;box-shadow:0 4px 24px rgba(107,94,122,0.08),inset 0 1px 0 rgba(255,255,255,0.4);color:var(--text-dark)}
.bubble img{max-width:200px;height:auto;border-radius:8px}
.bubble-action{border-left:3px solid #e04b4b !important}
.bubble-call{background:rgba(180,180,190,0.12)!important;border:1px solid rgba(180,180,190,0.18)!important;font-size:0.8rem;color:#8a8a9a;text-align:center;padding:8px 16px!important;letter-spacing:0.5px;border-radius:16px!important}
.bubble-exchange{background:rgba(255,248,235,0.85)!important;border:1px solid rgba(255,180,120,0.5)!important;border-radius:16px!important;padding:14px 16px!important;text-align:center!important;min-width:200px!important}
.bubble-exchange .ex-header{font-size:0.85rem;font-weight:500;color:var(--exchange-orange);margin-bottom:10px}
.bubble-exchange .ex-text{font-size:0.8rem;color:var(--text-dark);line-height:1.5;margin-bottom:10px;text-align:left}
.bubble-exchange .ex-img{width:80px;height:80px;border-radius:10px;object-fit:cover;margin:0 auto 6px;display:block}
.bubble-exchange .ex-name{font-size:0.9rem;font-weight:500;color:var(--text-dark);margin-bottom:2px}
.bubble-exchange .ex-price{font-size:0.85rem;color:#e04b4b;font-weight:500;margin-bottom:10px}
.bubble-exchange .ex-delivery{font-size:0.75rem;color:var(--mist-purple);line-height:1.4}
.btn-exchange{background:var(--exchange-orange)!important;color:#fff!important;border:none!important;padding:12px 28px!important;border-radius:24px!important;font-size:0.95rem!important;font-weight:500!important;letter-spacing:1px!important;cursor:pointer!important;width:100%!important;margin-top:8px!important}
.msg-meta{font-size:0.7rem;color:var(--mist-gray);margin-top:3px}
.message-row.me .msg-meta{text-align:right}
.message-row.partner .msg-meta{text-align:left}
.quote-block{background:rgba(196,187,209,0.15);border-left:3px solid var(--mist-purple);border-radius:6px;padding:6px 10px;margin-bottom:6px;font-size:0.8rem;color:var(--mist-purple);max-width:100%;overflow:hidden;cursor:pointer}
.quote-block img{width:40px;height:40px;border-radius:4px;object-fit:cover}
.typing-indicator{display:flex;align-items:flex-start;gap:8px;padding:4px 12px;margin-bottom:14px}
.typing-bubble{display:flex;align-items:center;gap:10px;background:rgba(196,187,209,0.25);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(196,187,209,0.3);border-radius:20px;padding:10px 16px}
.typing-dots{display:flex;gap:4px;align-items:center}
.typing-dot{width:7px;height:7px;border-radius:50%;background:var(--mist-purple);animation:bounce 1.4s infinite ease-in-out}
.typing-dot:nth-child(2){animation-delay:0.2s}
.typing-dot:nth-child(3){animation-delay:0.4s}
@keyframes bounce{0%,80%,100%{transform:scale(0.6);opacity:0.4}40%{transform:scale(1);opacity:1}}
.typing-text{font-size:0.8rem;color:var(--mist-purple);white-space:nowrap}
.warning-bar{background:#fff8f0;color:#b08968;text-align:center;padding:10px;font-size:0.8rem;border-bottom:1px solid #f0e6dc;flex-shrink:0}
.input-area{display:flex;align-items:center;gap:8px;padding:10px 12px;background:transparent;border-top:1px solid rgba(196,187,209,0.15);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);flex-shrink:0;position:relative}
.input-box{flex:1;background:rgba(243,240,247,0.5);border:1px solid rgba(196,187,209,0.3);border-radius:24px;padding:10px 16px;font-size:0.9rem;color:var(--text-dark);outline:none;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);font-family:inherit}
.input-box::placeholder{color:#b0a8b9}
.circle-btn{width:38px;height:38px;border-radius:50%;background:rgba(243,240,247,0.5);border:1px solid rgba(196,187,209,0.3);font-size:1.1rem;color:#b0a8b9;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);flex-shrink:0}
.send-btn{display:none;background:rgba(107,94,122,0.2);border:1px solid rgba(107,94,122,0.25);border-radius:20px;padding:8px 14px;color:var(--mist-purple);font-size:0.85rem;font-weight:500;cursor:pointer;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);letter-spacing:0.5px;white-space:nowrap;flex-shrink:0;opacity:0;transform:translateX(-6px);transition:opacity 0.2s,transform 0.2s;pointer-events:none}
.send-btn.visible{display:inline-block;opacity:1;transform:translateX(0);pointer-events:auto}
.tools-panel{display:none;position:absolute;bottom:60px;right:12px;background:rgba(255,255,255,0.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:20px;border:1px solid rgba(196,187,209,0.3);padding:16px;grid-template-columns:1fr 1fr 1fr;gap:14px 10px;z-index:20}
.tools-panel.show{display:grid}
.tool-item{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-width:56px}
.tool-label{font-size:0.7rem;color:var(--mist-purple);line-height:1.2;text-align:center}
.icon-camera{width:24px;height:24px;background:#6b5e7a;border-radius:4px;position:relative}
.icon-camera::before{content:"";position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:12px;height:5px;background:#6b5e7a;border-radius:3px 3px 0 0}
.icon-camera::after{content:"";position:absolute;top:4px;left:50%;transform:translateX(-50%);width:14px;height:10px;border-radius:50%;border:2px solid #fff}
.icon-photo{width:24px;height:24px;background:#6b5e7a;border-radius:3px;position:relative;overflow:hidden}
.icon-photo::before{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;background:#fff;border-radius:50%;box-shadow:-8px 10px 0 -2px rgba(255,255,255,0.7)}
.icon-photo::after{content:"";position:absolute;bottom:-2px;left:-2px;width:0;height:0;border-left:14px solid transparent;border-right:8px solid transparent;border-bottom:12px solid rgba(255,255,255,0.5)}
.icon-gift{width:24px;height:24px;display:flex;align-items:center;justify-content:center;position:relative}
.icon-gift::before{content:"❀";font-size:1.4rem;color:#6b5e7a;line-height:1}
.icon-video{width:24px;height:24px;position:relative}
.icon-video::before{content:"";position:absolute;left:0;top:3px;width:18px;height:18px;background:#6b5e7a;border-radius:3px}
.icon-video::after{content:"";position:absolute;left:18px;top:8px;width:5px;height:5px;background:#6b5e7a;border-radius:50%}
.icon-emoji{width:24px;height:24px;border-radius:50%;background:#6b5e7a;position:relative}
.icon-emoji::before{content:"";position:absolute;top:6px;left:5px;width:4px;height:4px;background:#fff;border-radius:50%;box-shadow:10px 0 0 #fff}
.icon-emoji::after{content:"";position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:12px;height:6px;border:2px solid #fff;border-top:none;border-radius:0 0 12px 12px}
.icon-action{width:24px;height:24px;position:relative}
.icon-action::before{content:"✰";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:1.4rem;color:#6b5e7a;line-height:1}
.icon-fab-toggle{width:24px;height:24px;border-radius:50%;border:2px solid #6b5e7a;position:relative}
.icon-fab-toggle::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:8px;height:8px;border-radius:50%;background:#6b5e7a}
.archive-tabs{display:flex;border-bottom:1px solid rgba(196,187,209,0.25);overflow-x:auto;-webkit-overflow-scrolling:touch;flex-shrink:0}
.archive-tab{flex:1;text-align:center;padding:14px 8px;font-size:0.8rem;color:var(--mist-gray);cursor:pointer;white-space:nowrap;position:relative;transition:color 0.2s}
.archive-tab.active{color:var(--mist-purple);font-weight:500}
.modal-overlay{position:fixed;inset:0;background:rgba(58,52,64,0.3);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:100}
.modal-box{width:300px;background:rgba(255,255,255,0.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:20px;border:1px solid rgba(196,187,209,0.3);padding:24px 20px 20px;text-align:center;max-height:70vh;overflow-y:auto;margin:30px 16px}
.modal-title{font-size:1rem;color:#3a3440;font-weight:500;margin-bottom:16px}
.modal-message{font-size:0.9rem;color:#3a3440;margin-bottom:16px;line-height:1.5}
.modal-input{width:100%;padding:10px 14px;border:1px solid rgba(196,187,209,0.4);border-radius:12px;font-size:0.9rem;color:#3a3440;background:rgba(243,240,247,0.3);outline:none;font-family:inherit;margin-bottom:14px}
.modal-buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn-modal{flex:1;min-width:80px;padding:10px 16px;border-radius:20px;font-size:0.85rem;cursor:pointer;border:none;font-family:inherit;font-weight:500;letter-spacing:0.5px;transition:transform 0.15s}
.btn-modal:active{transform:scale(0.94)}
.btn-modal-primary{background:rgba(107,94,122,0.2);color:#6b5e7a;border:1px solid rgba(107,94,122,0.25)}
.btn-modal-secondary{background:rgba(243,240,247,0.5);color:#a7a9be;border:1px solid rgba(196,187,209,0.3)}
.quote-preview{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(243,240,247,0.5);border-radius:12px;margin:0 12px 4px;font-size:0.8rem;color:var(--mist-purple)}
.quote-preview img{width:32px;height:32px;border-radius:4px;object-fit:cover}
.quote-preview .quote-close{cursor:pointer;color:#a7a9be;margin-left:auto}
.call-modal{width:85vw;max-width:380px;background:rgba(200,220,240,0.88);border-radius:24px;padding:24px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);transition:background 0.6s;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 8px 40px rgba(0,0,0,0.08),0 2px 8px rgba(0,0,0,0.04);cursor:grab;user-select:none;z-index:201;pointer-events:auto}
.call-modal:active{cursor:grabbing}
.call-modal.call-bg-company{background:rgba(255,240,230,0.9)}
.call-modal.call-bg-sleep{background:rgba(240,235,250,0.9)}
.call-avatar-wrap{position:relative;width:80px;height:80px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.call-avatar{width:36px;height:36px;border-radius:50%;background-size:cover;background-position:center;z-index:2;position:relative;background-color:rgba(150,200,235,0.5)}
.call-ripple{position:absolute;inset:-6px;border-radius:50%;border:1.5px solid rgba(130,180,225,0.5);animation:callRipple 2.5s ease-out infinite}
.call-ripple:nth-child(2){inset:-14px;animation-delay:0.6s;border-color:rgba(130,180,225,0.3)}
.call-ripple:nth-child(3){inset:-22px;animation-delay:1.2s;border-color:rgba(130,180,225,0.15)}
@keyframes callRipple{0%{transform:scale(0.9);opacity:0.7}100%{transform:scale(1.2);opacity:0}}
.call-nickname{color:#3a3440;font-size:1rem;font-weight:500}
.call-status{color:rgba(58,52,64,0.6);font-size:0.78rem;text-align:center;min-height:1.2em;max-width:260px;line-height:1.4}
.call-bars{display:flex;align-items:flex-end;gap:3px;height:20px}
.call-bar{width:3px;border-radius:2px;background:rgba(130,180,225,0.5);animation:callBarJump 0.8s ease-in-out infinite}
.call-bar:nth-child(1){height:8px;animation-delay:0s}
.call-bar:nth-child(2){height:14px;animation-delay:0.15s}
.call-bar:nth-child(3){height:18px;animation-delay:0.3s}
.call-bar:nth-child(4){height:12px;animation-delay:0.45s}
.call-bar:nth-child(5){height:6px;animation-delay:0.6s}
.call-bar.slow{animation-duration:1.8s}
.call-bar.sleep{animation-duration:3s}
@keyframes callBarJump{0%,100%{transform:scaleY(0.4);opacity:0.4}50%{transform:scaleY(1);opacity:1}}
.call-hint{color:rgba(58,52,64,0.5);font-size:0.8rem;min-height:1.2em}
.call-timer{color:#1a1820;font-size:2rem;font-weight:400;letter-spacing:2px;font-variant-numeric:tabular-nums;display:none}
.call-buttons{display:flex;flex-direction:column;gap:8px;align-items:center;margin-top:2px;width:100%}
.call-buttons-row{display:flex;gap:10px;justify-content:center;width:100%}
.btn-call{padding:10px 18px;border-radius:24px;border:1px solid transparent;font-size:0.8rem;cursor:pointer;transition:transform 0.15s,opacity 0.15s;font-family:inherit;font-weight:500;letter-spacing:1px}
.btn-call:active{transform:scale(0.94)}
.btn-call-sleep{background:rgba(180,170,218,0.4);border-color:rgba(180,170,218,0.25);color:#5a5070}
.btn-call-company{background:rgba(242,188,158,0.4);border-color:rgba(242,188,158,0.25);color:#7a5540}
.btn-call-minimize{background:rgba(255,255,255,0.7);border-color:rgba(200,200,210,0.3);color:#5a5a6a}
.btn-call-hangup{background:rgba(238,172,177,0.4);border-color:rgba(238,172,177,0.25);color:#7a5055}
.btn-call-accept{background:rgba(135,212,152,0.45);border-color:rgba(135,212,152,0.3);color:#3a6040;padding:12px 28px;font-size:0.9rem}
.btn-call-reject{background:rgba(238,172,172,0.45);border-color:rgba(238,172,172,0.3);color:#7a5050;padding:12px 28px;font-size:0.9rem}
.call-float-wrap{position:fixed;bottom:100px;right:16px;z-index:300;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.call-float{display:flex;align-items:center;gap:6px;cursor:grab;user-select:none;background:rgba(255,255,255,0.92);border-radius:20px;padding:6px 10px;box-shadow:0 2px 16px rgba(0,0,0,0.08);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);flex-shrink:0;transition:background 0.6s}
.call-float:active{cursor:grabbing}
.call-float.call-float-company{background:rgba(255,240,230,0.9)}
.call-float.call-float-sleep{background:rgba(240,235,250,0.9)}
.call-float-avatar{width:36px;height:36px;border-radius:50%;background-size:cover;background-position:center;border:2px solid rgba(150,200,235,0.5);box-shadow:0 1px 4px rgba(0,0,0,0.1);position:relative;flex-shrink:0}
.call-float-info{display:flex;flex-direction:column;gap:1px;min-width:0;align-items:flex-start}
.call-float-nickname{font-size:0.7rem;color:#3a3440;font-weight:500;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.call-float-dot-inline{width:7px;height:7px;border-radius:50%;background:#4cd964;animation:callDotPulse 1.5s ease-in-out infinite;flex-shrink:0}
@keyframes callDotPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(1.3)}}
.call-float-timer{font-size:0.65rem;color:#8a8a9a;font-variant-numeric:tabular-nums}
.call-float-close{width:18px;height:18px;border-radius:50%;background:rgba(238,172,172,0.5);color:#7a5050;font-size:0.6rem;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;border:none;margin-left:2px}
.call-float-bubble{background:rgba(255,255,255,0.92);color:#3a3440;font-size:0.73rem;padding:6px 12px;border-radius:14px;max-width:180px;line-height:1.3;box-shadow:0 1px 8px rgba(0,0,0,0.08);white-space:normal;word-break:break-word;overflow:visible;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.function-backdrop{position:fixed;inset:0;background:rgba(58,52,64,0.25);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:40;display:none;opacity:0;transition:opacity 0.3s;pointer-events:auto}
.function-backdrop.show{display:block;opacity:1}
.function-cards-container{position:fixed;inset:0;z-index:45;display:none;pointer-events:none}
.function-cards-container.show{display:block;pointer-events:none}
.function-card{position:absolute;background:rgba(255,255,255,0.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:16px;border:1px solid rgba(196,187,209,0.25);box-shadow:0 4px 20px rgba(107,94,122,0.1);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:transform 0.25s cubic-bezier(0.34,1.56,0.64,1),opacity 0.25s;opacity:0;transform:translate(0,40px) scale(0.8);overflow:hidden;pointer-events:auto}
.function-card.show{opacity:1}
.function-card:active{transform:scale(0.9)!important}
.function-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:4px;background:linear-gradient(180deg,transparent,rgba(107,94,122,0.08));border-radius:0 0 16px 16px}
.function-card .fc-icon{width:28px;height:28px;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center}
.function-card .fc-emoji{font-size:26px;line-height:1;color:#6b5e7a}
.function-card .fc-label{font-size:0.7rem;color:var(--mist-purple);font-weight:500;letter-spacing:0.5px}
.function-card.card-lg{width:100px;height:100px;border-radius:20px}
.function-card.card-md{width:80px;height:80px}
.function-card.card-sm{width:65px;height:65px;border-radius:14px}
.function-card.card-lg .fc-icon{width:34px;height:34px}
.function-card.card-lg .fc-emoji{font-size:30px}
.function-card.card-sm .fc-icon{width:22px;height:22px}
.function-card.card-sm .fc-emoji{font-size:22px}

.icon-css-message::before{content:"";position:absolute;top:5px;left:4px;width:16px;height:2px;background:#fff;border-radius:1px;box-shadow:0 5px 0 #fff,0 10px 0 #fff}
.icon-css-teach{width:100%;height:100%;position:relative}
.icon-css-teach::before{content:"";position:absolute;top:3px;left:2px;width:16px;height:12px;background:var(--mist-purple);border-radius:2px;border:1.5px solid var(--mist-purple);box-shadow:inset 0 0 0 1.5px #fff}
.icon-css-teach::after{content:"";position:absolute;bottom:2px;right:2px;width:2.5px;height:18px;background:var(--mist-purple);border-radius:2px;transform:rotate(-35deg);transform-origin:top center}

.icon-css-anniversary::before{content:"";position:absolute;top:3px;left:4px;right:4px;height:3px;background:#fff;border-radius:1px}
.icon-css-anniversary::after{content:"♥";position:absolute;bottom:1px;right:1px;font-size:8px;color:#e04b4b;line-height:1}
.icon-css-stats{width:100%;height:100%;position:relative;display:flex;align-items:flex-end;gap:3px;padding:0 2px}
.icon-css-stats::before{content:"";width:5px;height:10px;background:var(--mist-purple);border-radius:1px 1px 0 0}
.icon-css-stats::after{content:"";position:absolute;left:10px;bottom:0;width:5px;height:16px;background:var(--mist-purple);border-radius:1px 1px 0 0;box-shadow:8px 0 0 var(--mist-purple)}
.icon-css-cloud{width:100%;height:100%;position:relative}
.icon-css-cloud::before{content:"";position:absolute;bottom:3px;left:1px;right:1px;height:14px;background:var(--mist-purple);border-radius:2px}
.icon-css-cloud::after{content:"";position:absolute;top:4px;left:1px;width:12px;height:5px;background:var(--mist-purple);border-radius:2px 2px 0 0}

function renderCallModal(state){const oldModal=document.querySelector('.call-modal');if(oldModal)oldModal.remove();const oldBubble=document.querySelector('.call-float-bubble');if(oldBubble)oldBubble.remove();const modal=document.createElement('div');modal.className='call-modal';const name=aboutHim.nickname||aboutHim.name||'梦角';let hintText='';if(state==='calling')hintText='正在邀请...';else if(state==='incoming')hintText='对方邀请你视频通话...';else if(state==='rejected')hintText='对方拒绝了你的通话';const avatarBg=aboutHim.avatar?`background-image:url(${aboutHim.avatar});background-size:cover;background-position:center;background-color:transparent`:'background:rgba(150,200,235,0.5)';modal.innerHTML=`<div class="call-avatar-wrap"><div class="call-ripple"></div><div class="call-ripple"></div><div class="call-ripple"></div><div class="call-avatar" style="${avatarBg}"></div></div><div class="call-nickname">${name}</div><div class="call-status"></div><div class="call-bars"><div class="call-bar"></div><div class="call-bar"></div><div class="call-bar"></div><div class="call-bar"></div><div class="call-bar"></div></div><div class="call-hint">${hintText}</div><div class="call-timer">00:00</div><div class="call-buttons"></div>`;const btns=modal.querySelector('.call-buttons');if(state==='incoming'){btns.innerHTML=`<div class="call-buttons-row"><button class="btn-call btn-call-accept" id="btnAccept">接听</button><button class="btn-call btn-call-reject" id="btnReject">挂断</button></div>`}else if(state==='connected'){btns.innerHTML=`<div class="call-buttons-row"><button class="btn-call btn-call-sleep" id="btnSleep">陪睡</button><button class="btn-call btn-call-company" id="btnCompany">陪伴</button></div><div class="call-buttons-row"><button class="btn-call btn-call-minimize" id="btnMinimize">缩小</button><button class="btn-call btn-call-hangup" id="btnHangup">挂断</button></div>`}else if(state==='calling'){btns.innerHTML=`<div class="call-buttons-row"><button class="btn-call btn-call-minimize" id="btnMinimize"> function makeDraggable(el){let startX,startY,startLeft,startTop,dragging=!1;const onStart=e=>{if(e.target.closest('button'))return;dragging=!0;el.style.cursor='grabbing';const t=e.touches?e.touches[0]:e;startX=t.clientX;startY=t.clientY;const rect=el.getBoundingClientRect();startLeft=rect.left;startTop=rect.top;el.style.transition='none'};const onMove=e=>{if(!dragging)return;e.preventDefault();const t=e.touches?e.touches[0]:e;const dx=t.clientX-startX,dy=t.clientY-startY;el.style.left=(startLeft+dx)+'px';el.style.top=(startTop+dy)+'px';el.style.right='auto';el.style.bottom='auto';el.style.margin='0';el.style.transform='none'};const onEnd=()=>{dragging=!1;el.style.cursor=el.classList.contains('call-modal')?'grab':'';el.style.transition=''};el.addEventListener('mousedown',onStart);el.addEventListener('touchstart',onStart,{passive:!1});document.addEventListener('mousemove',onMove);document.addEventListener('touchmove',onMove,{passive:!1});document.addEventListener('mouseup',onEnd);document.addEventListener('touchend',onEnd)}

function showModal(title,message,options={}){return new Promise(resolve=>{modalResolve=resolve;const overlay=document.getElementById('modalOverlay'),box=document.getElementById('modalBox');const showCancel=options.showCancel!==!1;const inputType=options.inputType||null;const inputValue=options.inputValue||'';const inputPlaceholder=options.inputPlaceholder||'';const confirmText=options.confirmText||'确认';const cancelText=options.cancelText||'取消';box.innerHTML=`<div class="modal-title">${title}</div>${message?`<div class="modal-message">${message}</div>`:''}${inputType?`<input class="modal-input" id="modalInput" type="${inputType}" value="${escapeHtml(inputValue)}" placeholder="${inputPlaceholder}">`:''}<div class="modal-buttons">${showCancel?`<button class="btn-modal btn-modal-secondary" id="modalCancel">${cancelText}</button>`:''}<button class="btn-modal btn-modal-primary" id="modalConfirm">${confirmText}</button></div>`;overlay.style.display='flex';const confirmBtn=box.querySelector('#modalConfirm'),cancelBtn=box.querySelector('#modalCancel'),inputEl=box.querySelector('#modalInput');confirmBtn.onclick=()=>{overlay.style.display='none';resolve(inputEl?inputEl.value:!0);modalResolve=null};if(cancelBtn)cancelBtn.onclick=()=>{overlay.style.display='none';resolve(!1);modalResolve=null};overlay.onclick=e=>{if(e.target===overlay){overlay.style.display='none';resolve(!1);modalResolve=null}};if(inputEl){inputEl.focus();inputEl.addEventListener('keydown',e=>{if(e.key==='Enter'){overlay.style.display='none';resolve(inputEl.value);modalResolve=null}})}setTimeout(()=>{if(inputEl)inputEl.focus()},300)})}

function doRandomChoice(){const input=document.getElementById('randomInput');const text=input.value.trim();if(!text)return;const result=Math.random()<0.5?'yes':'no';const resultArea=document.getElementById('randomResult');const meAvatar=aboutMe.avatar?`background-image:url(${aboutMe.avatar});background-size:cover;background-position:center`:'';const himAvatar=aboutHim.avatar?`background-image:url(${aboutHim.avatar});background-size:cover;background-position:center`:'';const cardHTML=result==='yes'?'<div class="choice-card-yes">是</div>':'<div class="choice-card-no">否</div>';resultArea.innerHTML=`<div class="choice-result-row me"><div class="choice-result-bubble me">${text}</div><div class="choice-result-avatar me" style="${meAvatar}"></div></div><div class="choice-result-row partner"><div class="choice-result-avatar partner" style="${himAvatar}"></div><div class="choice-result-bubble partner">${cardHTML}</div></div>`;choiceHistory.push({type:'random',question:text,result:result,timestamp:Date.now()});dbSet('choiceHistory',choiceHistory);input.value=''}

function parsePlaylistSongs(){return playlistLibrary.map(s=>{const parts=s.split('｜');if(parts.length>=2)return{name:parts[0].trim(),id:parts[1].trim()};const p2=s.split('|');if(p2.length>=2)return{name:p2[0].trim(),id:p2[1].trim()};return null}).filter(s=>s!==null)}

function playSongAtIndex(idx){const songs=parsePlaylistSongs();if(idx<0||idx>=songs.length)return;musicCurrentIndex=idx;const song=songs[idx];if(musicPlayer){musicPlayer.pause();musicPlayer=null}clearInterval(musicProgressInterval);const url=`https://music.163.com/song/media/outer/url?id=${song.id}.mp3`;musicPlayer=new Audio(url);musicPlayer.play().then(()=>{musicIsPlaying=!0;updateMusicPlayIcon();startMusicProgress();updateMusicFloat()}).catch(()=>{showAlert('提示','播放失败，请尝试跳转网易云');musicIsPlaying=!1;updateMusicPlayIcon()});document.getElementById('musicNowPlaying').textContent=song.name;document.getElementById('musicProgressFill').style.width='0%';document.getElementById('musicProgressTime').textContent='00:00';renderMusicSongList();updateMusicCover()}

function bindCardEvents(content){content.querySelector('.btn-add-card').onclick=showCardModal;content.querySelector('.search-cards').oninput=e=>{const val=e.target.value.toLowerCase();content.querySelectorAll('.card-item').forEach(item=>{item.style.display=item.dataset.card.toLowerCase().includes(val)?'flex':'none'})};const actions=content.querySelector('#cardActions');actions.onclick=async e=>{const btn=e.target.closest('button');if(!btn)return;if(btn.classList.contains('btn-select-all')){cardShowCheck=!0;const allSel=cardSel.size===cardLibrary.length;if(allSel)cardSel.clear();else cardLibrary.forEach(c=>cardSel.add(c));renderCardListDOM(content);updateCardActionsDOM(content)}else if(btn.classList.contains('btn-cancel-select')){cardShowCheck=!1;cardSel.clear();renderCardListDOM(content);updateCardActionsDOM(content)}else if(btn.classList.contains('btn-import-cards')){content.querySelector('.file-import-cards').click()}else if(btn.classList.contains('btn-export-cards')){exportCardsTxt()}else if(btn.classList.contains('btn-delete-selected')){if(cardSel.size===0)return;const ok=await showConfirm('删除确认',`删除选中的 ${cardSel.size} 条字卡？`);if(!ok)return;cardLibrary=cardLibrary.filter(c=>!cardSel.has(c));cardSel.clear();cardShowCheck=!1;await dbSet('cardLibrary',cardLibrary);updateWarningBar();renderCardListDOM(content);updateCardCount(content);updateCardActionsDOM(content)}};content.querySelector('.file-import-cards').onchange=e=>importCardsTxt(e,content);updateCardActionsDOM(content)}
function updateCardActionsDOM(content){const actions=content.querySelector('#cardActions');if(cardShowCheck){actions.innerHTML=`<button class="btn-select-all" style="flex:1;padding:10px;border:1px solid rgba(196,187,209,0.3);border-radius:10px;background:rgba(243,240,247,0.3);color:#6b5e7a;font-size:0.8rem;white-space:nowrap">全选</button><button class="btn-cancel-select" style="flex:1;padding:10px;border:1px solid rgba(196,187,209,0.3);border-radius:10px;background:rgba(243,240,247,0.3);color:#6b5e7a;font-size:0.8rem;white-space:nowrap">取消</button><button class="btn-import-cards" style="flex:1;padding:10px;border:1px solid rgba(196,187,209,0.3);border-radius:10px;background:rgba(243,240,247,0.3);color:#6b5e7a;font-size:0.8rem;white-space:nowrap">导入</button><button class="btn-export-cards" style="flex:1;padding:10px;border:1px solid rgba(196,187,209,0.3);border-radius:10px;background:rgba(243,240,247,0.3);color:#6b5e7a;font-size:0.8rem;white-space:nowrap">导出</button><button class="btn-delete-selected" style="flex:1;padding:10px;border:1px solid rgba(196,187,209,0.3);border-radius:10px;background:rgba(243,240,247,0.3);color:#a7a9be;font-size:0.8rem;white-space:nowrap">删除选中</button>`}else{actions.innerHTML=`<button class="btn-select-all" style="flex:1;padding:10px;border:1px solid rgba(196,187,209,0.3);border-radius:10px;background:rgba(243,240,247,0.3);color:#6b5e7a;font-size:0.8rem;white-space:nowrap">全选</button><button class="btn-cancel-select" style="flex:1;padding:10px;border:1px solid rgba(196,187,209,0.3);border-radius:10px;background:rgba(243,240,247,0.3);color:#6b5e7a;font-size:0.8rem;white-space:nowrap">取消</button><button class="btn-import-cards" style="flex:1;padding:10px;border:1px solid rgba(196,187,209,0.3);border-radius:10px;background:rgba(243,240,247,0.3);color:#6b5e7a;font-size:0.8rem;white-space:nowrap">导入</button><button class="btn-export-cards" style="flex:1;padding:10px;border:1px solid rgba(196,187,209,0.3);border-radius:10px;background:rgba(243,2 function updateCardCount(content){const el=content.querySelector('.card-count');if(el)el.textContent=`共 ${cardLibrary.length} 条`}
function rebindCardItemsDOM(content){content.querySelectorAll('.card-item').forEach(item=>{const card=item.dataset.card,check=item.querySelector('.card-check');if(check){check.onclick=()=>{if(cardSel.has(card)){cardSel.delete(card);check.textContent='□';check.style.color='#a7a9be'}else{cardSel.add(card);check.textContent='☑';check.style.color='#6b5e7a'}}}item.querySelector('.card-delete').onclick=async()=>{const ok=await showConfirm('删除确认',`删除"${card}"？`);if(!ok)return;cardLibrary=cardLibrary.filter(c=>c!==card);await dbSet('cardLibrary',cardLibrary);cardSel.delete(card);updateWarningBar();renderCardListDOM(content);updateCardCount(content)};item.querySelector('.card-edit').onclick=async()=>{const nv=await showPrompt('编辑字卡','字卡内容',card);if(nv&&nv.trim()!==card){const t=nv.trim();if(cardLibrary.some(c=>c===t)){await showAlert('提示','该字卡已存在');return}const idx=cardLibrary.indexOf(card);if(idx>-1)cardLibrary[idx]=t;dbSet('cardLibrary',cardLibrary);renderCardListDOM(content);updateCardCount(content)}}})}
function showCardModal(){const overlay=document.getElementById('modalOverlay'),box=document.getElementById('modalBox');box.innerHTML=`<div style="font-size:1rem;color:#3a3440;font-weight:500;margin-bottom:16px">字卡内容</div><textarea class="modal-textarea" placeholder="他会用这些字卡回复你哦" style="width:100%;height:150px;padding:14px;border:1px solid rgba(196,187,209,0.4);border-radius:14px;font-size:0.9rem;color:#3a3440;background:rgba(243,240,247,0.3);outline:none;resize:vertical;line-height:1.6;text-align:center;font-family:inherit"></textarea><div style="font-size:0.75rem;color:#a7a9be;margin-top:8px">一行一条字卡，换行分隔</div><button class="btn-save-cards" style="width:100%;margin-top:14px;padding:12px;background:#6b5e7a;color:#fff;border:none;border-radius:14px;font-size:0.95rem">保存字卡</button>`;overlay.style.display='flex';box.querySelector('.btn-save-cards').onclick=async()=>{const text=box.querySelector('.modal-textarea').value,lines=text.split('\n').map(l=>l.trim()).filter(l=>l.length>0),unique=[...new Set(lines)],dups=unique.filter(u=>cardLibrary.includes(u));if(dups.length>0)await showAlert('提示',`以下字卡已存在，已跳过：${dups.join('、')}`);const nc=unique.filter(u=>!cardLibrary.includes(u));if(nc.length>0){cardLibrary.push(...nc);await dbSet('cardLibrary',cardLibrary);updateWarningBar();const cc=document.getElementById('cardsContent');renderCardListDOM(cc);updateCardCount(cc)}overlay.style.display='none'};overlay.onclick=e=>{if(e.target===overlay)overlay.style.display='none'}}
function exportCardsTxt(){const text=cardLibrary.join('\n'),blob=new Blob([text],{type:'text/plain'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='回复字卡.txt';a.click();URL.revokeObjectURL(url)}
async function importCardsTxt(e,content){const file=e.target.files[0];if(!file)return;const text=await file.text(),lines=text.split('\n').map(l=>l.trim()).filter(l=>l.length>0),dups=lines.filter(l=>cardLibrary.includes(l)),nc=lines.filter(l=>!cardLibrary.includes(l));cardLibrary.push(...nc);await dbSet('cardLibrary',cardLibrary);updateWarningBar();renderCardListDOM(content);updateCardCount(content);if(dups.length>0)await showAlert('提示',`已跳过 ${dups.length} 条重复字卡`);e.target.value=''}

function bindStickerEvents(content){content.querySelector('.btn-add-sticker').onclick=()=>content.querySelector('.file-add-sticker').click();content.querySelector('.file-add-sticker').onchange=async e=>{for(const f of e.target.files){const b64=await readFileAsDataURL(f);stickerLibrary.push(b64)}await dbSet('stickerLibrary',stickerLibrary);renderStickerGridDOM(content);updateStickerCount(content);e.target.value=''};const actions=content.querySelector('#stickerActions');actions.onclick=async e=>{const btn=e.target.closest('button');if(!btn)return;if(btn.classList.contains('btn-select-all-sticker')){stickerShowCheck=!0;const allSel=stickerSel.size===stickerLibrary.length;if(allSel)stickerSel.clear();else stickerLibrary.forEach((_,i)=>stickerSel.add(i));renderStickerGridDOM(content);updateStickerActionsDOM(content)}else if(btn.classList.contains('btn-cancel-sticker')){stickerShowCheck=!1;stickerSel.clear();renderStickerGridDOM(content);updateStickerActionsDOM(content)}else if(btn.classList.contains('btn-import-sticker')){content.querySelector('.file-import-sticker').click()}else if(btn.classList.contains('btn-export-sticker')){const data=JSON.stringify(stickerLibrary),blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='贴纸.json';a.click();URL.revokeObjectURL(url)}else if(btn.classList.contains('btn-delete-sticker')){if(stickerSel.size===0)return;const ok=await showConfirm('删除确认',`删除选中的 ${stickerSel.size} 张贴纸？`);if(!ok)return;const arr=[];stickerLibrary.forEach((s,i)=>{if(!stickerSel.has(i))arr.push(s)});stickerLibrary=arr;stickerSel.clear();stickerShowCheck=!1;await dbSet('stickerLibrary',stickerLibrary);renderStickerGridDOM(content);updateStickerCount(content);updateStickerActionsDOM(content)}};content.querySelector('.file-import-sticker').onchange=async e=>{const f=e.target.files[0];if(!f)return;const t=await f.text();try{const imported=JSON.parse(t);if(Array.isArray(imported)){const ns=imported.filter(s=>!stickerLibrary.includes(s));stickerLibrary.push(...ns);await dbSet('stickerLibrary',stickerLibrary);renderStickerGridDOM(content);updateStickerCount(content);if(ns.length<imported.length)await showAlert('提示',`已跳过 ${imported.length-ns.length} 个重复贴纸`)}}catch(err){await showAlert('提示','文件格式错误')}e.target.value=''};updateStickerActionsDOM(content)}
function updateStickerActionsDOM(content){const actions=content.querySelector('#stickerActions');if(stickerShowCheck){actions.innerHTML=`<button class="btn-select-all-sticker" style="flex:1;padding:10px;border:1px solid rgba(196,187,209,0.3);border-radius:10px;background:rgba(243,240,247,0.3);color:#6b5e7a;font-size:0.8rem">全选</button><button class="btn-cancel-sticker" style="flex:1;padding:10px;border:1px solid rgba(196,187,209,0.3);border-radius:10px;background:rgba(243,240,247,0.3);color:#6b5e7a;font-size:0.8rem">取消</button><button class="btn-import-sticker" style="flex:1;padding:10px;border:1px solid rgba(196,187,209,0.3);border-radius:10px;background:rgba(243,240,247,0.3);color:#6b5e7a;font-size:0.8rem">导入</button><button class="btn-export-sticker" style="flex:1;padding:10px;border:1px solid rgba(196,187,209,0.3);border-radius:10px;background:rgba(243,240,247,0.3);color:#6b5e7a;font-size:0.8rem">导出</button><button class="btn-delete-sticker" style="flex:1;padding:10px;border:1px solid rgba(196,187,209,0.3);border-radius:10px;background:rgba(243,240,247,0.3);color:#a7a9be;font-size:0.8rem">删除选中</button>`}else{actions.innerHTML=`<button class="btn-select-all-sticker" style="flex:1;padding:10px;border:1px solid rgba(196,187,209,0.3);border-radius:10px;background:rgba(243,240,247,0.3);color:#6b5e7a;font-size:0.8rem">全选</button><button class="btn-cancel-sticker" style="flex:1;padding:10px;border:1px solid rgba(196,187,209,0.3);border-radius:10px;background:rgba(243,240,247,0.3);color:#6b5e7a;font-size:0.8rem">取消</button><button class="btn-import-sticker" style="flex:1;padding:10px;border:1px solid rgba(196,187,209,0.3);border-radius:10px;background:rgba(243,240,247,0.3);color:#6b5e7a;font-size:0.8rem">导入</button><button class="btn-export-sticker" style="flex:1;padding:10px;border:1px solid rgba(196,187,209,0.3);border-radius:10px;background:rgba(243,240,247,0.3);color:#6b5e7a;font-size:0.8rem">导出</button>`}}

function rebindStickerItemsDOM(content){content.querySelectorAll('.sticker-item').forEach(item=>{const idx=parseInt(item.dataset.index),check=item.querySelector('.sticker-check');if(check){check.onclick=ev=>{ev.stopPropagation();if(stickerSel.has(idx)){stickerSel.delete(idx);check.textContent='□'}else{stickerSel.add(idx);check.textContent='☑'}}}});content.querySelectorAll('.sticker-del').forEach(btn=>{btn.onclick=async ev=>{ev.stopPropagation();const idx=parseInt(btn.dataset.idx);const ok=await showConfirm('删除确认','删除这张贴纸？');if(!ok)return;stickerLibrary.splice(idx,1);stickerSel.delete(idx);await dbSet('stickerLibrary',stickerLibrary);renderStickerGridDOM(content);updateStickerCount(content)}})}

function renderSpaceBody(body){const today=getTodayStr();let checkinHTML='';if(myCheckInDate===today&&partnerCheckInDate===today){checkinHTML=`<div class="space-checkin-btn done">♥ 共同打卡 ${bothCheckInDays} 天</div>`}else if(myCheckInDate===today){checkinHTML=`<div class="space-checkin-btn waiting"><span class="checkin-heart">♥</span> 连续打卡 ${checkInStreak} 天</div>`}else{checkinHTML=`<div class="space-checkin-btn undone" id="spaceCheckinBtn">♡ 打卡</div>`}const reminderHTML=`<div class="checkin-reminder-bar" style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(255,200,210,0.15);border:1px solid rgba(255,180,190,0.25);border-radius:12px;margin-bottom:10px;font-size:0.8rem;color:var(--text-dark);flex-shrink:0"><span>⏰ 打卡提醒</span><span class="reminder-time" id="reminderTime" style="color:#a04050;font-weight:500;cursor:pointer">${checkinReminderTime}</span><span class="reminder-toggle" id="reminderToggle" style="cursor:pointer;color:#a7a9be;font-size:0.75rem">${checkinReminderEnabled?'关闭':'开启'}</span></div>`;const pendingText=partnerPostPending?(()=>{const remain=Math.max(0,partnerPostPending.delay-(Date.now()-partnerPostPending.time));return`预计 ${Math.ceil(remain/60000)} 分钟后发布`})():'';const dynamicsHTML=spaceDynamics.length===0?'<div style="text-align:center;color:#a7a9be;font-size:0.8rem;padding:20px">暂无动态</div>':spaceDynamics.slice().sort((a,b)=>b.timestamp-a.timestamp).map(d=>{const himAvatarBg=aboutHim.avatar?`background-image:url(${aboutHim.avatar});background-size:cover;background-position:center`:'';const meAvatarBg=aboutMe.avatar?`background-image:url(${aboutMe.avatar});background-size:cover;background-position:center`:'';const avatarBg=d.role==='user'?meAvatarBg:himAvatarBg;const avatarClass=d.role==='user'?'me':'him';const nickname=d.role==='user'?(aboutMe.name||'我'):(aboutHim.nickname||aboutHim.name||'TA');const dt=new Date(d.timestamp);const timeStr=`${dt.getMonth()+1}月${dt.getDate()}日 ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;let contentHTML=d.content;if(d.image)contentHTML+=`<img src="${d.image}">`;return`<div class="space-dynamic-card"><div class="space-dynamic-header"><div class="space-dynamic-avatar ${avatarClass}" style="${avatarBg}"></div><span class="space-dynamic-nickname">${nickname}</span><span class="space-dynamic-time">${timeStr}</span></div><div class="space-dynamic-content">${contentHTML}</div></div>`}).join('');const ad=new Date(spaceActivatedDate+'T00:00:00');const adStr=`${ad.getFullYear()}年${ad.getMonth()+1}月${ad.getDate()}日`;body.innerHTML=`<div class="space-ann-card-inline"><div class="saci-icon">♥ 纪念日</div><div class="saci-title">激活恋人空间这一天</div><div class="saci-date">${adStr}</div></div>${reminderHTML}<div style="flex-shrink:0;display:flex;flex-direction:column;gap:6px">${checkinHTML}<div class="space-post-btns"><button class="space-post-btn" id="spacePostBtn">โพสต์ข่าวสาร</button><button class="space-post-btn" id="spaceAskPostBtn">ให้เขาโพสต์ข้อความ</button><div class="space-post-pending" id="spacePostPending">${pendingText}</div></div></div><div class="space-dynamics-list">${dynamicsHTML}</div>`;const checkinBtn=body.querySelector('#spaceCheckinBtn');if(checkinBtn){checkinBtn.addEventListener('click',()=>doMyCheckIn(body))}const postBtn=body.querySelector('#spacePostBtn');if(postBtn)postBtn.addEventListener('click',openSpacePostPanel);const askPostBtn=body.querySelector('#spaceAskPostBtn');if(askPostBtn)askPostBtn.addEventListener('click',askPartnerPost);const reminderTime=body.querySelector('#reminderTime');const reminderToggle=body.querySelector('#reminderToggle');if(reminderTime){reminderTime.addEventListener('click',async()=>{const input=await showPrompt('设置提醒时间','请输入时间，格式 HH:MM（如 21:00）',checkinReminderTime);if(input&&/^([01]?\d|2[0-3]):[0-5]\d$/.test(input.trim())){checkinReminderTime=input.trim();await dbSet('checkinReminderTime',checkinReminderTime);renderSpaceBody(body)}else if(input){await showAlert('提示','时间格式不正确，请输入如 21:00')}})}if(reminderToggle){reminderToggle.addEventListener('click',async()=>{checkinReminderEnabled=!checkinReminderEnabled;await dbSet('checkinReminderEnabled',checkinReminderEnabled);renderSpaceBody(body)})}}
async function doMyCheckIn(body){const today=getTodayStr();myCheckInDate=today;checkInStreak=await updateCheckInStreak();myTotalCheckIns++;addLovePoints(10);await dbSet('myCheckInDate',myCheckInDate);await dbSet('checkInStreak',checkInStreak);await dbSet('myTotalCheckIns',myTotalCheckIns);const delay=Math.random()*15*60*1000;partnerCheckInPending={time:Date.now(),delay};await dbSet('partnerCheckInPending',partnerCheckInPending);renderSpaceBody(body);showCheckinSuccess()}
function showCheckinSuccess(){const overlay=document.getElementById('spaceCheckinSuccessOverlay');const card=document.getElementById('spaceCheckinSuccessCard');const himAvatar=aboutHim.avatar?`background-image:url(${aboutHim.avatar});background-size:cover;background-position:center`:'';const meAvatar=aboutMe.avatar?`background-image:url(${aboutMe.avatar});background-size:cover;background-position:center`:'';const now=new Date();const weekdays=['日','一','二','三','四','五','六'];const dateStr=`${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 周${weekdays[now.getDay()]}`;card.innerHTML=`<div class="scs-avatars"><div class="scs-avatar him" style="${himAvatar}"></div><div class="scs-avatar me" style="${meAvatar}"></div></div><div class="scs-title">情侣空间</div><div class="scs-wait">等待对方打卡</div><div class="scs-done">打卡成功</div><div class="scs-date">${dateStr}</div>`;overlay.classList.add('show');setTimeout(()=>{overlay.classList.remove('show')},2500)}
async function updateCheckInStreak(){const today=getTodayStr();const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);const yesterdayStr=`${yesterday.getFullYear()}-${String(yesterday.getMonth()+1).padStart(2,'0')}-${String(yesterday.getDate()).padStart(2,'0')}`;if(partnerCheckInDate===yesterdayStr&&myCheckInDate===yesterdayStr){return checkInStreak+1}return 1}
async function partnerAutoCheckIn(){const today=getTodayStr();partnerCheckInDate=today;partnerTotalCheckIns++;addLovePoints(10);partnerCheckInPending=null;await dbSet('partnerCheckInDate',partnerCheckInDate);await dbSet('partnerTotalCheckIns',partnerTotalCheckIns);await dbSet('partnerCheckInPending',null);if(myCheckInDate===today){bothCheckInDays++;addLovePoints(20);checkInStreak=await updateCheckInStreak();await dbSet('bothCheckInDays',bothCheckInDays);await dbSet('checkInStreak',checkInStreak)}}
function checkSpacePending(){if(partnerCheckInPending&&Date.now()-partnerCheckInPending.time>=partnerCheckInPending.delay&&partnerCheckInDate!==getTodayStr()){partnerAutoCheckIn()}if(partnerPostPending&&Date.now()-partnerPostPending.time>=partnerPostPending.delay){doPartnerPost()}}
function openSpacePostPanel(){document.getElementById('spacePostTextarea').value='';document.getElementById('spacePostPreview').style.display='none';spacePostImageData=null;document.getElementById('spacePostOverlay').classList.add('show');setTimeout(()=>document.getElementById('spacePostTextarea').focus(),300)}
async function submitSpacePost(){const text=document.getElementById('spacePostTextarea').value.trim();if(!text&&!spacePostImageData)return;addLovePoints(5);const post={role:'user',content:text||'',image:spacePostImageData||null,timestamp:Date.now()};spaceDynamics.push(post);await dbSet('spaceDynamics',spaceDynamics);const delay=Math.random()*15*60*1000;partnerPostPending={time:Date.now(),delay};await dbSet('partnerPostPending',partnerPostPending);document.getElementById('spacePostOverlay').classList.remove('show');const body=document.getElementById('spaceBody');if(body)renderSpaceBody(body)}
async function askPartnerPost(){if(partnerPostPending)return;const delay=Math.random()*15*60*1000;partnerPostPending={time:Date.now(),delay};await dbSet('partnerPostPending',partnerPostPending);const body=document.getElementById('spaceBody');if(body)renderSpaceBody(body)}
async function doPartnerPost(){partnerPostPending=null;await dbSet('partnerPostPending',null);addLovePoints(5);const pool=[...cardLibrary,...teachingLibrary];if(pool.length===0)return;const count=8+Math.floor(Math.random()*8);const parts=[];for(let i=0;i<count;i++){parts.push(pool[Math.floor(Math.random()*pool.length)])}const content=parts.map((p,i)=>{if(i===parts.length-1){if(/[。！？~…\.!\?]$/.test(p))return p;return p+'。'}if(/[。！？~…\.!\?]$/.test(p))return p;return Math.random()<0.3?p+'。':p+'，'}).join('');let image=null;if(Math.random()<0.5&&stickerLibrary.length>0){image=stickerLibrary[Math.floor(Math.random()*stickerLibrary.length)]}const post={role:'partner',content:content,image:image,timestamp:Date.now()};spaceDynamics.push(post);await dbSet('spaceDynamics',spaceDynamics);const body=document.getElementById('spaceBody');if(body)renderSpaceBody(body)}
function bindSpaceEvents(){document.getElementById('spaceInviteOverlay').addEventListener('click',function(e){if(e.target===this)this.classList.remove('show')});document.getElementById('spaceOverlay').addEventListener('click',function(e){if(e.target===this)this.classList.remove('show')});document.getElementById('spacePostOverlay').addEventListener('click',function(e){if(e.target===this)this.classList.remove('show')});document.getElementById('spaceCheckinSuccessOverlay').addEventListener('click',function(e){if(e.target===this)this.classList.remove('show')});document.getElementById('spacePostSubmit').addEventListener('click',submitSpacePost);document.getElementById('spacePostAddImg').addEventListener('click',()=>document.getElementById('spacePostImageInput').click());document.getElementById('spacePostImageInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{spacePostImageData=ev.target.result;const preview=document.getElementById('spacePostPreview');preview.src=spacePostImageData;preview.style.display='block'};r.readAsDataURL(f);e.target.value=''});document.getElementById('spacePostTextarea').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submitSpacePost()}})}
const favHintStyle=document.createElement('style');
favHintStyle.textContent='@keyframes favHintFade{0%{opacity:0;transform:translate(-50%,-50%) scale(0.8)}20%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%)}}';
document.head.appendChild(favHintStyle);
document.getElementById('hiddenFileInput').addEventListener('change',handleImageUpload);
document.getElementById('hiddenCameraInput').addEventListener('change',handleImageUpload);
document.addEventListener('DOMContentLoaded',init);
</script>
