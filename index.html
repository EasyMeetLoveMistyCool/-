<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>易遇♡雾凉</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--mist-gray:#a7a9be;--mist-purple:#6b5e7a;--mist-light:#c4bbd1;--bg-light:#f3f0f7;--text-dark:#3a3440;--heart-red:#e04b4b;--white:#fff;--border-light:rgba(196,187,209,0.25)}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;font-weight:400;background:#faf9fb;color:var(--text-dark);width:100vw;height:100vh;height:100dvh;overflow:hidden;user-select:none;-webkit-user-select:none;position:relative}
.app-container{display:flex;flex-direction:column;width:100%;height:100%;position:relative;z-index:1}
.desktop-bg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;background-repeat:no-repeat}
.header-bar{display:flex;align-items:center;justify-content:center;padding:8px 16px;min-height:52px;flex-shrink:0;background:transparent;position:relative;z-index:10}
.header-avatars{display:flex;flex-direction:column;align-items:center}
.avatar-row{display:flex;align-items:center;gap:0}
.avatar-him,.avatar-me{width:40px;height:40px;border-radius:50%;flex-shrink:0;object-fit:cover;background:var(--mist-light)}
.avatar-me{background:var(--mist-purple)}
.header-nickname{font-size:0.75rem;color:var(--mist-purple);text-align:center;margin-top:2px;font-weight:400}
.page{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;display:none;position:relative;z-index:1}
.page.active{display:flex;flex-direction:column}
.nav-bar{display:flex;flex-shrink:0;background:transparent;border-top:1px solid rgba(196,187,209,0.15);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:10}
.nav-item{flex:1;text-align:center;padding:12px 0;font-size:0.9rem;letter-spacing:0.5em;color:var(--mist-gray);cursor:pointer;transition:color 0.2s;font-weight:400;background:transparent;border:none;font-family:inherit}
.nav-item.active{color:var(--mist-purple)}
.chat-area{flex:1;overflow-y:auto;padding:8px 12px}
.message-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:14px}
.message-row.partner{justify-content:flex-start}
.message-row.me{justify-content:flex-end}
.message-row.system{justify-content:center}
.msg-avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;object-fit:cover;background:var(--mist-light)}
.msg-avatar.me{background:var(--mist-purple)}
.msg-content{display:flex;flex-direction:column;max-width:85%}
.msg-content.partner{align-items:flex-start}
.msg-content.me{align-items:flex-end}
.msg-content.system{align-items:center;max-width:100%}
.bubble{padding:10px 14px;font-size:0.95rem;line-height:1.5;word-break:break-word;width:fit-content;max-width:100%;border-radius:20px}
.bubble-partner{background:rgba(255,255,255,0.45);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border:1px solid rgba(255,255,255,0.6);border-radius:20px;box-shadow:0 4px 24px rgba(107,94,122,0.06),inset 0 1px 0 rgba(255,255,255,0.5);color:var(--text-dark)}
.bubble-me{background:rgba(107,94,122,0.18);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border:1px solid rgba(255,255,255,0.5);border-radius:20px;box-shadow:0 4px 24px rgba(107,94,122,0.08),inset 0 1px 0 rgba(255,255,255,0.4);color:var(--text-dark)}
.bubble img{max-width:200px;height:auto;border-radius:8px}
.bubble-action{border-left:3px solid #e04b4b !important}
.bubble-call{background:rgba(180,180,190,0.12)!important;border:1px solid rgba(180,180,190,0.18)!important;font-size:0.8rem;color:#8a8a9a;text-align:center;padding:8px 16px!important;letter-spacing:0.5px;border-radius:16px!important}
.msg-meta{font-size:0.7rem;color:var(--mist-gray);margin-top:3px}
.message-row.me .msg-meta{text-align:right}
.message-row.partner .msg-meta{text-align:left}
.quote-block{background:rgba(196,187,209,0.15);border-left:3px solid var(--mist-purple);border-radius:6px;padding:6px 10px;margin-bottom:6px;font-size:0.8rem;color:var(--mist-purple);max-width:100%;overflow:hidden}
.quote-block img{width:40px;height:40px;border-radius:4px;object-fit:cover}
.typing-indicator{display:flex;align-items:flex-start;gap:8px;padding:4px 12px;margin-bottom:14px}
.typing-bubble{display:flex;align-items:center;gap:10px;background:rgba(196,187,209,0.25);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(196,187,209,0.3);border-radius:20px;padding:10px 16px}
.typing-dots{display:flex;gap:4px;align-items:center}
.typing-dot{width:7px;height:7px;border-radius:50%;background:var(--mist-purple);animation:bounce 1.4s infinite ease-in-out}
.typing-dot:nth-child(2){animation-delay:0.2s}
.typing-dot:nth-child(3){animation-delay:0.4s}
@keyframes bounce{0%,80%,100%{transform:scale(0.6);opacity:0.4}40%{transform:scale(1);opacity:1}}
.typing-text{font-size:0.8rem;color:var(--mist-purple);white-space:nowrap}
.warning-bar{background:#fff8f0;color:#b08968;text-align:center;padding:10px;font-size:0.8rem;border-bottom:1px solid #f0e6dc;flex-shrink:0}
.input-area{display:flex;align-items:center;gap:8px;padding:10px 12px;background:transparent;border-top:1px solid rgba(196,187,209,0.15);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);flex-shrink:0;position:relative}
.input-box{flex:1;background:rgba(243,240,247,0.5);border:1px solid rgba(196,187,209,0.3);border-radius:24px;padding:10px 16px;font-size:0.9rem;color:var(--text-dark);outline:none;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);font-family:inherit}
.input-box::placeholder{color:#b0a8b9}
.circle-btn{width:38px;height:38px;border-radius:50%;background:rgba(243,240,247,0.5);border:1px solid rgba(196,187,209,0.3);font-size:1.1rem;color:#b0a8b9;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);flex-shrink:0}
.send-btn{display:none;background:rgba(107,94,122,0.2);border:1px solid rgba(107,94,122,0.25);border-radius:20px;padding:8px 14px;color:var(--mist-purple);font-size:0.85rem;font-weight:500;cursor:pointer;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);letter-spacing:0.5px;white-space:nowrap;flex-shrink:0;opacity:0;transform:translateX(-6px);transition:opacity 0.2s,transform 0.2s;pointer-events:none}
.send-btn.visible{display:inline-block;opacity:1;transform:translateX(0);pointer-events:auto}
.tools-panel{display:none;position:absolute;bottom:60px;right:12px;background:rgba(255,255,255,0.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:20px;border:1px solid rgba(196,187,209,0.3);padding:16px;grid-template-columns:1fr 1fr 1fr;gap:14px 10px;z-index:20}
.tools-panel.show{display:grid}
.tool-item{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-width:56px}
.tool-label{font-size:0.7rem;color:var(--mist-purple);line-height:1.2;text-align:center}
.icon-camera{width:24px;height:24px;background:#6b5e7a;border-radius:4px;position:relative}
.icon-camera::before{content:"";position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:12px;height:5px;background:#6b5e7a;border-radius:3px 3px 0 0}
.icon-camera::after{content:"";position:absolute;top:4px;left:50%;transform:translateX(-50%);width:14px;height:10px;border-radius:50%;border:2px solid #fff}
.icon-photo{width:24px;height:24px;background:#6b5e7a;border-radius:3px;position:relative;overflow:hidden}
.icon-photo::before{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;background:#fff;border-radius:50%;box-shadow:-8px 10px 0 -2px rgba(255,255,255,0.7)}
.icon-photo::after{content:"";position:absolute;bottom:-2px;left:-2px;width:0;height:0;border-left:14px solid transparent;border-right:8px solid transparent;border-bottom:12px solid rgba(255,255,255,0.5)}
.icon-gift{width:24px;height:24px;display:flex;align-items:center;justify-content:center;position:relative}
.icon-gift::before{content:"❀";font-size:1.4rem;color:#6b5e7a;line-height:1}
.icon-video{width:24px;height:24px;position:relative}
.icon-video::before{content:"";position:absolute;left:0;top:3px;width:18px;height:18px;background:#6b5e7a;border-radius:3px}
.icon-video::after{content:"";position:absolute;left:18px;top:8px;width:5px;height:5px;background:#6b5e7a;border-radius:50%}
.icon-emoji{width:24px;height:24px;border-radius:50%;background:#6b5e7a;position:relative}
.icon-emoji::before{content:"";position:absolute;top:6px;left:5px;width:4px;height:4px;background:#fff;border-radius:50%;box-shadow:10px 0 0 #fff}
.icon-emoji::after{content:"";position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:12px;height:6px;border:2px solid #fff;border-top:none;border-radius:0 0 12px 12px}
.icon-action{width:24px;height:24px;position:relative}
.icon-action::before{content:"✰";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:1.4rem;color:#6b5e7a;line-height:1}
.icon-fab-toggle{width:24px;height:24px;border-radius:50%;border:2px solid #6b5e7a;position:relative}
.icon-fab-toggle::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:8px;height:8px;border-radius:50%;background:#6b5e7a}
.archive-tabs{display:flex;border-bottom:1px solid rgba(196,187,209,0.25);overflow-x:auto;-webkit-overflow-scrolling:touch;flex-shrink:0}
.archive-tab{flex:1;text-align:center;padding:14px 8px;font-size:0.8rem;color:var(--mist-gray);cursor:pointer;white-space:nowrap;position:relative;transition:color 0.2s}
.archive-tab.active{color:var(--mist-purple);font-weight:500}
.modal-overlay{position:fixed;inset:0;background:rgba(58,52,64,0.3);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:100}
.modal-box{width:300px;background:rgba(255,255,255,0.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:20px;border:1px solid rgba(196,187,209,0.3);padding:24px 20px 20px;text-align:center;max-height:80vh;overflow-y:auto}
.modal-title{font-size:1rem;color:#3a3440;font-weight:500;margin-bottom:16px}
.modal-message{font-size:0.9rem;color:#3a3440;margin-bottom:16px;line-height:1.5}
.modal-input{width:100%;padding:10px 14px;border:1px solid rgba(196,187,209,0.4);border-radius:12px;font-size:0.9rem;color:#3a3440;background:rgba(243,240,247,0.3);outline:none;font-family:inherit;margin-bottom:14px}
.modal-buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn-modal{flex:1;min-width:80px;padding:10px 16px;border-radius:20px;font-size:0.85rem;cursor:pointer;border:none;font-family:inherit;font-weight:500;letter-spacing:0.5px;transition:transform 0.15s}
.btn-modal:active{transform:scale(0.94)}
.btn-modal-primary{background:rgba(107,94,122,0.2);color:#6b5e7a;border:1px solid rgba(107,94,122,0.25)}
.btn-modal-secondary{background:rgba(243,240,247,0.5);color:#a7a9be;border:1px solid rgba(196,187,209,0.3)}
.quote-preview{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(243,240,247,0.5);border-radius:12px;margin:0 12px 4px;font-size:0.8rem;color:var(--mist-purple)}
.quote-preview img{width:32px;height:32px;border-radius:4px;object-fit:cover}
.quote-preview .quote-close{cursor:pointer;color:#a7a9be;margin-left:auto}

/* ===== 视频通话 ===== */
.call-modal{width:85vw;max-width:380px;background:rgba(200,220,240,0.88);border-radius:24px;padding:24px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);transition:background 0.6s;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 8px 40px rgba(0,0,0,0.08),0 2px 8px rgba(0,0,0,0.04);cursor:grab;user-select:none;z-index:201;pointer-events:auto}
.call-modal:active{cursor:grabbing}
.call-modal.call-bg-company{background:rgba(255,240,230,0.9)}
.call-modal.call-bg-sleep{background:rgba(240,235,250,0.9)}
.call-avatar-wrap{position:relative;width:80px;height:80px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.call-avatar{width:36px;height:36px;border-radius:50%;background-size:cover;background-position:center;z-index:2;position:relative;background-color:rgba(150,200,235,0.5)}
.call-ripple{position:absolute;inset:-6px;border-radius:50%;border:1.5px solid rgba(130,180,225,0.5);animation:callRipple 2.5s ease-out infinite}
.call-ripple:nth-child(2){inset:-14px;animation-delay:0.6s;border-color:rgba(130,180,225,0.3)}
.call-ripple:nth-child(3){inset:-22px;animation-delay:1.2s;border-color:rgba(130,180,225,0.15)}
@keyframes callRipple{0%{transform:scale(0.9);opacity:0.7}100%{transform:scale(1.2);opacity:0}}
.call-nickname{color:#3a3440;font-size:1rem;font-weight:500}
.call-status{color:rgba(58,52,64,0.6);font-size:0.78rem;text-align:center;min-height:1.2em;max-width:260px;line-height:1.4}
.call-bars{display:flex;align-items:flex-end;gap:3px;height:20px}
.call-bar{width:3px;border-radius:2px;background:rgba(130,180,225,0.5);animation:callBarJump 0.8s ease-in-out infinite}
.call-bar:nth-child(1){height:8px;animation-delay:0s}
.call-bar:nth-child(2){height:14px;animation-delay:0.15s}
.call-bar:nth-child(3){height:18px;animation-delay:0.3s}
.call-bar:nth-child(4){height:12px;animation-delay:0.45s}
.call-bar:nth-child(5){height:6px;animation-delay:0.6s}
.call-bar.slow{animation-duration:1.8s}
.call-bar.sleep{animation-duration:3s}
@keyframes callBarJump{0%,100%{transform:scaleY(0.4);opacity:0.4}50%{transform:scaleY(1);opacity:1}}
.call-hint{color:rgba(58,52,64,0.5);font-size:0.8rem;min-height:1.2em}
.call-timer{color:#1a1820;font-size:2rem;font-weight:400;letter-spacing:2px;font-variant-numeric:tabular-nums;display:none}
.call-buttons{display:flex;flex-direction:column;gap:8px;align-items:center;margin-top:2px;width:100%}
.call-buttons-row{display:flex;gap:10px;justify-content:center;width:100%}
.btn-call{padding:10px 18px;border-radius:24px;border:1px solid transparent;font-size:0.8rem;cursor:pointer;transition:transform 0.15s,opacity 0.15s;font-family:inherit;font-weight:500;letter-spacing:1px}
.btn-call:active{transform:scale(0.94)}
.btn-call-sleep{background:rgba(180,170,218,0.4);border-color:rgba(180,170,218,0.25);color:#5a5070}
.btn-call-company{background:rgba(242,188,158,0.4);border-color:rgba(242,188,158,0.25);color:#7a5540}
.btn-call-minimize{background:rgba(255,255,255,0.7);border-color:rgba(200,200,210,0.3);color:#5a5a6a}
.btn-call-hangup{background:rgba(238,172,177,0.4);border-color:rgba(238,172,177,0.25);color:#7a5055}
.btn-call-accept{background:rgba(135,212,152,0.45);border-color:rgba(135,212,152,0.3);color:#3a6040;padding:12px 28px;font-size:0.9rem}
.btn-call-reject{background:rgba(238,172,172,0.45);border-color:rgba(238,172,172,0.3);color:#7a5050;padding:12px 28px;font-size:0.9rem}
.call-float-wrap{position:fixed;bottom:100px;right:16px;z-index:300;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.call-float{display:flex;align-items:center;gap:6px;cursor:grab;user-select:none;background:rgba(255,255,255,0.92);border-radius:20px;padding:6px 10px;box-shadow:0 2px 16px rgba(0,0,0,0.08);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);flex-shrink:0;transition:background 0.6s}
.call-float:active{cursor:grabbing}
.call-float.call-float-company{background:rgba(255,240,230,0.9)}
.call-float.call-float-sleep{background:rgba(240,235,250,0.9)}
.call-float-avatar{width:36px;height:36px;border-radius:50%;background-size:cover;background-position:center;border:2px solid rgba(150,200,235,0.5);box-shadow:0 1px 4px rgba(0,0,0,0.1);position:relative;flex-shrink:0}
.call-float-info{display:flex;flex-direction:column;gap:1px;min-width:0;align-items:flex-start}
.call-float-nickname{font-size:0.7rem;color:#3a3440;font-weight:500;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.call-float-dot-inline{width:7px;height:7px;border-radius:50%;background:#4cd964;animation:callDotPulse 1.5s ease-in-out infinite;flex-shrink:0}
@keyframes callDotPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(1.3)}}
.call-float-timer{font-size:0.65rem;color:#8a8a9a;font-variant-numeric:tabular-nums}
.call-float-close{width:18px;height:18px;border-radius:50%;background:rgba(238,172,172,0.5);color:#7a5050;font-size:0.6rem;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;border:none;margin-left:2px}
.call-float-bubble{background:rgba(255,255,255,0.92);color:#3a3440;font-size:0.73rem;padding:6px 12px;border-radius:14px;max-width:180px;line-height:1.3;box-shadow:0 1px 8px rgba(0,0,0,0.08);white-space:normal;word-break:break-word;overflow:visible;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

/* ===== 功能卡片 ===== */
.function-backdrop{position:fixed;inset:0;background:rgba(58,52,64,0.25);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:40;display:none;opacity:0;transition:opacity 0.3s}
.function-backdrop.show{display:block;opacity:1}
.function-cards-container{position:fixed;bottom:150px;right:20px;z-index:45;display:none;pointer-events:none}
.function-cards-container.show{display:block;pointer-events:auto}
.function-card{position:absolute;background:rgba(255,255,255,0.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:16px;border:1px solid rgba(196,187,209,0.25);box-shadow:0 4px 20px rgba(107,94,122,0.1);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:transform 0.25s cubic-bezier(0.34,1.56,0.64,1),opacity 0.25s;opacity:0;transform:translate(0,40px) scale(0.8);overflow:hidden}
.function-card.show{opacity:1}
.function-card:active{transform:scale(0.9)!important}
.function-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:4px;background:linear-gradient(180deg,transparent,rgba(107,94,122,0.08));border-radius:0 0 16px 16px}
.function-card .fc-icon{width:28px;height:28px;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center}
.function-card .fc-emoji{font-size:26px;line-height:1;color:#6b5e7a}
.function-card .fc-label{font-size:0.7rem;color:var(--mist-purple);font-weight:500;letter-spacing:0.5px}
.function-card.card-lg{width:110px;height:110px;border-radius:20px}
.function-card.card-md{width:90px;height:90px}
.function-card.card-sm{width:75px;height:75px;border-radius:14px}
.function-card.card-lg .fc-icon{width:34px;height:34px}
.function-card.card-lg .fc-emoji{font-size:30px}
.function-card.card-sm .fc-icon{width:22px;height:22px}
.function-card.card-sm .fc-emoji{font-size:22px}
.function-card.card-sm .fc-label{font-size:0.65rem}

.icon-css-message{width:100%;height:100%;background:var(--mist-purple);border-radius:3px;position:relative}
.icon-css-message::before{content:"";position:absolute;top:5px;left:4px;width:16px;height:2px;background:#fff;border-radius:1px;box-shadow:0 5px 0 #fff,0 10px 0 #fff}
.icon-css-teach{width:100%;height:100%;position:relative}
.icon-css-teach::before{content:"";position:absolute;top:3px;left:2px;width:16px;height:12px;background:var(--mist-purple);border-radius:2px;border:1.5px solid var(--mist-purple);box-shadow:inset 0 0 0 1.5px #fff}
.icon-css-teach::after{content:"";position:absolute;bottom:2px;right:2px;width:2.5px;height:18px;background:var(--mist-purple);border-radius:2px;transform:rotate(-35deg);transform-origin:top center}
.icon-css-anniversary{width:100%;height:100%;background:var(--mist-purple);border-radius:3px;position:relative}
.icon-css-anniversary::before{content:"";position:absolute;top:3px;left:4px;right:4px;height:3px;background:#fff;border-radius:1px}
.icon-css-anniversary::after{content:"♥";position:absolute;bottom:1px;right:1px;font-size:8px;color:#e04b4b;line-height:1}

.music-header{display:flex;align-items:center;justify-content:center;padding:12px 16px;flex-shrink:0;gap:8px}

/* ===== 全局悬浮球 ===== */
.global-fab{position:fixed;bottom:90px;right:20px;width:52px;height:52px;border-radius:50%;background-size:cover;background-position:center;background-color:rgba(107,94,122,0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:2px solid rgba(196,187,209,0.3);box-shadow:0 4px 20px rgba(107,94,122,0.25);z-index:50;cursor:pointer;animation:fabPulse 2.5s ease-in-out infinite;transition:transform 0.2s,opacity 0.3s;overflow:hidden}
.global-fab:active{transform:scale(0.9)}
.global-fab.hidden{display:none}
.global-fab.has-image{background-color:transparent;border:none;box-shadow:0 4px 20px rgba(107,94,122,0.3);animation:none;background-size:cover;overflow:hidden}
.global-fab.has-image::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:2px solid rgba(196,187,209,0.25);animation:fabPulse 2.5s ease-in-out infinite;pointer-events:none}
@keyframes fabPulse{0%,100%{box-shadow:0 4px 20px rgba(107,94,122,0.25)}50%{box-shadow:0 4px 28px rgba(107,94,122,0.4)}}
.fab-default-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:18px;height:18px;border:2px solid rgba(255,255,255,0.8);border-radius:50%}
.fab-default-icon::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:6px;height:6px;background:rgba(255,255,255,0.8);border-radius:50%}

function loadCallState(){try{const s=JSON.parse(localStorage.getItem('callState'));if(s&&s.active){callState.active=s.active;callState.startTime=s.startTime;callState.mode=s.mode||'normal';callState.direction=s.direction||'outgoing';callState.minimized=s.minimized||!1;if(callState.minimized){renderCallFloat();startCallTimers()}else{renderCallModal('connected');startCallTimers()}return!0}}catch(e){}return!1}
function clearCallState(){callState.active=!1;callState.startTime=null;callState.mode='normal';callState.minimized=!1;clearCallTimers();localStorage.removeItem('callState');const f=document.querySelector('.call-float-wrap');if(f)f.remove();const o=document.querySelector('.call-modal');if(o)o.remove();const b=document.querySelector('.call-float-bubble');if(b)b.remove()}
function clearCallTimers(){if(callState.statusInterval)clearInterval(callState.statusInterval);if(callState.timerInterval)clearInterval(callState.timerInterval);if(callState.incomingTimer)clearTimeout(callState.incomingTimer);if(callState.hangupCheckTimer)clearInterval(callState.hangupCheckTimer);if(callState.answerTimer)clearTimeout(callState.answerTimer);callState.statusInterval=null;callState.timerInterval=null;callState.incomingTimer=null;callState.hangupCheckTimer=null;callState.answerTimer=null}
function startCallTimers(){clearCallTimers();updateCallTimer();callState.timerInterval=setInterval(updateCallTimer,1000);setTimeout(()=>{const timerEl=document.querySelector('.call-timer');if(timerEl)timerEl.style.display='block'},100);updateCallStatusDisplay();callState.statusInterval=setInterval(updateCallStatusDisplay,30000);scheduleIncomingCall();scheduleHangupCheck()}
function scheduleIncomingCall(){if(callState.incomingTimer)clearTimeout(callState.incomingTimer);const delay=30*60000;callState.incomingTimer=setTimeout(()=>{saveLastIncomingCheck();if(!callState.active&&Math.random()<0.15){openVideoIncoming()}scheduleIncomingCall()},delay)}
function scheduleHangupCheck(){if(callState.hangupCheckTimer)clearInterval(callState.hangupCheckTimer);callState.hangupCheckTimer=setInterval(()=>{if(callState.active&&callState.mode==='normal'&&Math.random()<0.05){hangupCall('partner')}},900000)}
function openVideo(){if(callState.active)return;callState.active=!0;callState.startTime=null;callState.mode='normal';callState.direction='outgoing';callState.minimized=!1;saveCallState();renderCallModal('calling');const answerDelay=Math.random()*30000;callState.answerTimer=setTimeout(()=>{if(Math.random()<0.7){callState.startTime=Date.now();saveCallState();if(document.querySelector('.call-modal'))renderCallModal('connected');startCallTimers()}else{if(document.querySelector('.call-modal')){const hint=document.querySelector('.call-hint');if(hint)hint.textContent='对方拒绝了你的通话';totalCallCount++;dbSet('totalCallCount',totalCallCount);setTimeout(()=>{clearCallState();addCallMessage('☏ 对方拒绝了你的通话')},2000)}}},answerDelay);setTimeout(()=>{if(callState.active&&!callState.timerInterval&&document.querySelector('.call-modal')){totalCallCount++;dbSet('totalCallCount',totalCallCount);clearCallState();addCallMessage('☏ 无人接听')}},30000)}
function openVideoIncoming(){if(callState.active)return;callState.active=!0;callState.startTime=null;callState.mode='normal';callState.direction='incoming';callState.minimized=!1;saveCallState();renderCallModal('incoming');callState.answerTimer=setTimeout(()=>{if(callState.active&&!callState.timerInterval){totalCallCount++;dbSet('totalCallCount',totalCallCount);clearCallState();addCallMessage('☏ 未接来电·对方邀请你视频通话')}},30000)}
function renderCallModal(state){const oldModal=document.querySelector('.call-modal');if(oldModal)oldModal.remove();const oldBubble=document.querySelector('.call-float-bubble');if(oldBubble)oldBubble.remove();const modal=document.createElement('div');modal.className='call-modal';const name=aboutHim.nickname||aboutHim.name||'梦角';let hintText='';if(state==='calling')hintText='正在邀请...';else if(state==='incoming')hintText='对方邀请你视频通话...';else if(state==='rejected')hintText='对方拒绝了你的通话';const avatarBg=aboutHim.avatar?`background-image:url(${aboutHim.avatar});background-size:cover;background-position:center;background-color:transparent`:'background:rgba(150,200,235,0.5)';modal.innerHTML=`<div class="call-avatar-wrap"><div class="call-ripple"></div><div class="call-ripple"></div><div class="call-ripple"></div><div class="call-avatar" style="${avatarBg}"></div></div><div class="call-nickname">${name}</div><div class="call-status"></div><div class="call-bars"><div class="call-bar"></div><div class="call-bar"></div><div class="call-bar"></div><div class="call-bar"></div><div class="call-bar"></div></div><div class="call-hint">${hintText}</div><div class="call-timer">00:00</div><div class="call-buttons"></div>`;const btns=modal.querySelector('.call-buttons');if(state==='incoming'){btns.innerHTML=`<div class="call-buttons-row"><button class="btn-call btn-call-accept" id="btnAccept">接听</button><button class="btn-call btn-call-reject" id="btnReject">挂断</button></div>`}else if(state==='connected'){btns.innerHTML=`<div class="call-buttons-row"><button class="btn-call btn-call-sleep" id="btnSleep">陪睡</button><button class="btn-call btn-call-company" id="btnCompany">陪伴</button></div><div class="call-buttons-row"><button class="btn-call btn-call-minimize" id="btnMinimize">缩小</button><button class="btn-call btn-call-hangup" id="btnHangup">挂断</button></div>`}else if(state==='calling'){btns.innerHTML=`<div class="call-buttons-row"><button class="btn-call btn-call-minimize" id="btnMinimize">缩小</button><button class="btn-call btn-call-hangup" id="btnHangup">挂断</button></div>`}document.body.appendChild(modal);if(callState.mode==='company')modal.classList.add('call-bg-company');if(callState.mode==='sleep')modal.classList.add('call-bg-sleep');if(state==='connected'||(state==='calling'&&callState.timerInterval))updateCallStatusDisplay();bindCallModalEvents(modal,state);makeDraggable(modal)}
function bindCallModalEvents(modal,state){const accept=modal.querySelector('#btnAccept');if(accept)accept.onclick=()=>{if(callState.answerTimer)clearTimeout(callState.answerTimer);acceptCall()};const reject=modal.querySelector('#btnReject');if(reject)reject.onclick=()=>{if(callState.answerTimer)clearTimeout(callState.answerTimer);rejectCall()};const hangup=modal.querySelector('#btnHangup');if(hangup)hangup.onclick=()=>{if(callState.answerTimer)clearTimeout(callState.answerTimer);hangupCall('self')};const minimize=modal.querySelector('#btnMinimize');if(minimize)minimize.onclick=()=>minimizeCall();const sleep=modal.querySelector('#btnSleep');if(sleep)sleep.onclick=()=>switchCallMode('sleep');const company=modal.querySelector('#btnCompany');if(company)company.onclick=()=>switchCallMode('company')}
function acceptCall(){callState.startTime=Date.now();callState.mode='normal';saveCallState();renderCallModal('connected');startCallTimers()}
function rejectCall(){totalCallCount++;dbSet('totalCallCount',totalCallCount);clearCallState();addCallMessage('☏ 已拒绝')}
function hangupCall(by){const dur=callState.startTime?Math.floor((Date.now()-callState.startTime)/1000):0;const t=formatCallDuration(dur);if(by==='partner'){const modal=document.querySelector('.call-modal');if(modal){const hint=modal.querySelector('.call-hint');if(hint)hint.textContent='对方已挂断';setTimeout(()=>{clearCallState();addCallMessage('☏ 通话结束·'+t)},2000);if(dur>0){totalCallCount++;answeredCallCount++;totalCallDuration+=dur;if(dur>maxCallDuration)maxCallDuration=dur;dbSet('totalCallCount',totalCallCount);dbSet('answeredCallCount',answeredCallCount);dbSet('totalCallDuration',totalCallDuration);dbSet('maxCallDuration',maxCallDuration)}else{totalCallCount++;dbSet('totalCallCount',totalCallCount)}return}}if(dur>0){totalCallCount++;answeredCallCount++;totalCallDuration+=dur;if(dur>maxCallDuration)maxCallDuration=dur;dbSet('totalCallCount',totalCallCount);dbSet('answeredCallCount',answeredCallCount);dbSet('totalCallDuration',totalCallDuration);dbSet('maxCallDuration',maxCallDuration)}else{totalCallCount++;dbSet('totalCallCount',totalCallCount)}clearCallState();addCallMessage('☏ 通话结束·'+t)}
function formatCallDuration(sec){const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;if(h>0)return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function switchCallMode(mode){callState.mode=mode;saveCallState();const modal=document.querySelector('.call-modal');if(!modal)return;modal.classList.remove('call-bg-company','call-bg-sleep');if(mode==='company')modal.classList.add('call-bg-company');if(mode==='sleep')modal.classList.add('call-bg-sleep');const hint=modal.querySelector('.call-hint');if(mode==='company'){if(hint)hint.textContent='正在陪伴中...';setTimeout(()=>{if(hint&&callState.mode==='company')hint.textContent=''},5000)}if(mode==='sleep'){if(hint)hint.textContent='一起入睡中...';setTimeout(()=>{if(hint&&callState.mode==='sleep')hint.textContent=''},5000)}const bars=modal.querySelectorAll('.call-bar');bars.forEach(b=>{b.classList.remove('slow','sleep');if(mode==='company')b.classList.add('slow');if(mode==='sleep')b.classList.add('sleep')});updateCallStatusDisplay();const float=document.querySelector('.call-float');if(float){float.classList.remove('call-float-company','call-float-sleep');if(mode==='company')float.classList.add('call-float-company');if(mode==='sleep')float.classList.add('call-float-sleep')}}
function updateCallTimer(){if(!callState.active||!callState.startTime)return;const sec=Math.floor((Date.now()-callState.startTime)/1000);const timerEl=document.querySelector('.call-timer');if(timerEl)timerEl.textContent=formatCallDuration(sec);const floatTimer=document.querySelector('.call-float-timer');if(floatTimer)floatTimer.textContent=formatCallDuration(sec)}
function updateCallStatusDisplay(){let arr;if(callState.mode==='company')arr=statusCompany;else if(callState.mode==='sleep')arr=statusSleep;else arr=statusNormal;const text=arr[Math.floor(Math.random()*arr.length)];const el=document.querySelector('.call-status');if(el)el.textContent=text;const bubble=document.querySelector('.call-float-bubble');if(bubble)bubble.textContent=text}
function minimizeCall(){callState.minimized=!0;saveCallState();const modal=document.querySelector('.call-modal');if(modal)modal.remove();const bubble=document.querySelector('.call-float-bubble');if(bubble)bubble.remove();renderCallFloat()}
function renderCallFloat(){const oldWrap=document.querySelector('.call-float-wrap');if(oldWrap)oldWrap.remove();const avatarBg=aboutHim.avatar?`background-image:url(${aboutHim.avatar});background-size:cover;background-position:center;background-color:transparent`:'background:rgba(150,200,235,0.5)';const name=aboutHim.nickname||aboutHim.name||'梦角';const wrap=document.createElement('div');wrap.className='call-float-wrap';wrap.innerHTML=`<div class="call-float" id="callFloat"><div class="call-float-avatar" style="${avatarBg}"></div><div class="call-float-info"><div class="call-float-nickname">${name}</div><div class="call-float-timer">00:00</div></div><div class="call-float-dot-inline"></div><button class="call-float-close" id="floatClose">✕</button></div><div class="call-float-bubble"></div>`;document.body.appendChild(wrap);if(callState.mode==='company')wrap.querySelector('.call-float').classList.add('call-float-company');if(callState.mode==='sleep')wrap.querySelector('.call-float').classList.add('call-float-sleep');wrap.querySelector('#floatClose').onclick=e=>{e.stopPropagation();hangupCall('self')};wrap.querySelector('.call-float').onclick=()=>restoreCall();updateCallStatusDisplay();updateCallTimer();makeDraggable(wrap)}
function restoreCall(){callState.minimized=!1;saveCallState();const wrap=document.querySelector('.call-float-wrap');if(wrap)wrap.remove();renderCallModal('connected')}
function addCallMessage(text){const msg={id:Date.now().toString(),role:'system',type:'call',content:text,timestamp:Date.now()};messages.push(msg);dbSet('messages',messages);appendMessageToDOM(msg)}
function makeDraggable(el){let startX,startY,startLeft,startTop,dragging=!1;const onStart=e=>{if(e.target.closest('button'))return;dragging=!0;el.style.cursor='grabbing';const t=e.touches?e.touches[0]:e;startX=t.clientX;startY=t.clientY;const rect=el.getBoundingClientRect();startLeft=rect.left;startTop=rect.top;el.style.transition='none'};const onMove=e=>{if(!dragging)return;e.preventDefault();const t=e.touches?e.touches[0]:e;const dx=t.clientX-startX,dy=t.clientY-startY;el.style.left=(startLeft+dx)+'px';el.style.top=(startTop+dy)+'px';el.style.right='auto';el.style.bottom='auto';el.style.margin='0';el.style.transform='none'};const onEnd=()=>{dragging=!1;el.style.cursor=el.classList.contains('call-modal')?'grab':'';el.style.transition=''};el.addEventListener('mousedown',onStart);el.addEventListener('touchstart',onStart,{passive:!1});document.addEventListener('mousemove',onMove);document.addEventListener('touchmove',onMove,{passive:!1});document.addEventListener('mouseup',onEnd);document.addEventListener('touchend',onEnd)}

/* ===== 自定义弹窗系统 ===== */
let modalResolve=null;
function showModal(title,message,options={}){return new Promise(resolve=>{modalResolve=resolve;const overlay=document.getElementById('modalOverlay'),box=document.getElementById('modalBox');const showCancel=options.showCancel!==!1;const inputType=options.inputType||null;const inputValue=options.inputValue||'';const inputPlaceholder=options.inputPlaceholder||'';const confirmText=options.confirmText||'确认';const cancelText=options.cancelText||'取消';box.innerHTML=`<div class="modal-title">${title}</div>${message?`<div class="modal-message">${message}</div>`:''}${inputType?`<input class="modal-input" id="modalInput" type="${inputType}" value="${escapeHtml(inputValue)}" placeholder="${inputPlaceholder}">`:''}<div class="modal-buttons">${showCancel?`<button class="btn-modal btn-modal-secondary" id="modalCancel">${cancelText}</button>`:''}<button class="btn-modal btn-modal-primary" id="modalConfirm">${confirmText}</button></div>`;overlay.style.display='flex';const confirmBtn=box.querySelector('#modalConfirm'),cancelBtn=box.querySelector('#modalCancel'),inputEl=box.querySelector('#modalInput');confirmBtn.onclick=()=>{overlay.style.display='none';resolve(inputEl?inputEl.value:!0);modalResolve=null};if(cancelBtn)cancelBtn.onclick=()=>{overlay.style.display='none';resolve(!1);modalResolve=null};overlay.onclick=e=>{if(e.target===overlay){overlay.style.display='none';resolve(!1);modalResolve=null}};if(inputEl){inputEl.focus();inputEl.addEventListener('keydown',e=>{if(e.key==='Enter'){overlay.style.display='none';resolve(inputEl.value);modalResolve=null}})}setTimeout(()=>{if(inputEl)inputEl.focus()},300)})}
function showAlert(title,message){return showModal(title,message,{showCancel:!1,confirmText:'知道了'})}
function showConfirm(title,message){return showModal(title,message,{showCancel:!0,confirmText:'确认',cancelText:'取消'})}
function showPrompt(title,placeholder,value){return showModal(title,'',{inputType:'text',inputValue:value||'',inputPlaceholder:placeholder||'',showCancel:!1,confirmText:'保存'})}
function escapeHtml(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}

function saveLastIncomingCheck(){lastIncomingCheck=Date.now();localStorage.setItem('lastIncomingCheck',lastIncomingCheck)}
function loadLastIncomingCheck(){const saved=localStorage.getItem('lastIncomingCheck');lastIncomingCheck=saved?parseInt(saved):Date.now()}
function saveLastIncomingMsgCheck(){lastIncomingMsgCheck=Date.now();localStorage.setItem('lastIncomingMsgCheck',lastIncomingMsgCheck)}

function checkIncomingOnStartup(){const now=Date.now();const interval=30*60000;const elapsed=now-lastIncomingCheck;if(elapsed>=interval){const missedChecks=Math.floor(elapsed/interval);for(let i=0;i<missedChecks;i++){if(!callState.active&&Math.random()<0.15){openVideoIncoming();break}}}saveLastIncomingCheck();scheduleIncomingCall()}
async function checkIncomingMsgOnStartup(){const now=Date.now();const interval=15*60000;const elapsed=now-lastIncomingMsgCheck;if(elapsed>=interval&&cardLibrary.length>0){const pool=[...cardLibrary,...teachingLibrary];const count=1+Math.floor(Math.random()*3);for(let j=0;j<count;j++){const text=pool[Math.floor(Math.random()*pool.length)];const msg={id:Date.now().toString()+'_startup_'+j,role:'partner',content:text,type:'text',timestamp:Date.now()};messages.push(msg);await dbSet('messages',messages);appendMessageToDOM(msg);if(j<count-1)await sleep(2000+Math.random()*3000)}}saveLastIncomingMsgCheck();scheduleIncomingMessage()}

function scheduleIncomingMessage(){const delay=15*60000;setTimeout(async()=>{saveLastIncomingMsgCheck();if(cardLibrary.length>0){const pool=[...cardLibrary,...teachingLibrary];const count=1+Math.floor(Math.random()*3);for(let i=0;i<count;i++){const text=pool[Math.floor(Math.random()*pool.length)];const msg={id:Date.now().toString()+'_'+i,role:'partner',content:text,type:'text',timestamp:Date.now()};messages.push(msg);await dbSet('messages',messages);appendMessageToDOM(msg);if(i<count-1)await sleep(2000+Math.random()*3000)}}scheduleIncomingMessage()},delay)}

  async function triggerReply(){if(isTyping)return;isTyping=!0;const typingEl=document.getElementById('typingIndicator');typingEl.style.display='flex';scrollToBottom();const delay=8000+Math.random()*12000,count=Math.floor(Math.random()*3)+1;const fragment=document.createDocumentFragment();for(let i=0;i<count;i++){await sleep(i===0?delay:1500+Math.random()*3000);if(!spaceActivated&&Math.random()<0.15){showSpaceInvite();isTyping=!1;typingEl.style.display='none';return}if(spaceActivated&&myCheckInDate===getTodayStr()&&partnerCheckInDate!==getTodayStr()&&!partnerCheckInPending&&Math.random()<0.15){partnerAutoCheckIn()}if(Math.random()<0.05&&teachingLibrary.length>0){const t=teachingLibrary[Math.floor(Math.random()*teachingLibrary.length)];const msg={id:Date.now().toString()+'_'+i,role:'partner',type:'text',content:t,timestamp:Date.now()};messages.push(msg);await dbSet('messages',messages);fragment.appendChild(createMessageDOM(msg));renderCount=Math.min(renderCount+1,messages.length);continue}if(Math.random()<0.01&&giftLibrary.length>0){const g=giftLibrary[Math.floor(Math.random()*giftLibrary.length)];const msg={id:Date.now().toString()+'_'+i,role:'partner',type:'gift',content:`${g.icon} ${g.name}`,description:g.desc,timestamp:Date.now()};messages.push(msg);await dbSet('messages',messages);fragment.appendChild(createMessageDOM(msg));renderCount=Math.min(renderCount+1,messages.length);continue}if(Math.random()<0.03&&interactions.partner.length+customInteractions.partner.length>0){const all=[...interactions.partner,...customInteractions.partner];const action=all[Math.floor(Math.random()*all.length)];const msg={id:Date.now().toString()+'_'+i,role:'partner',type:'action',content:action.name,description:action.desc,timestamp:Date.now()};messages.push(msg);await dbSet('messages',messages);fragment.appendChild(createMessageDOM(msg));renderCount=Math.min(renderCount+1,messages.length);continue}const replyContent=cardLibrary[Math.floor(Math.random()*cardLibrary.length)];let final lex:1;min-width:0;padding:10px;border:1px solid rgba(196,187,209,0.4);border-radius:12px;font-size:0.9rem;background:rgba(243,240,247,0.3);outline:none"></div><div style="display:flex;gap:6px"><button class="btn-send-action" style="flex:1;padding:10px 12px;background:#6b5e7a;color:#fff;border:none;border-radius:12px;font-size:0.85rem;white-space:nowrap">โต้ตอบ</button><button class="btn-save-action" style="flex:1;padding:10px 12px;background:rgba(107,94,122,0.12);color:#6b5e7a;border:1px solid rgba(107,94,122,0.3);border-radius:12px;font-size:0.85rem;white-space:nowrap">存我</button></div></div>`;overlay.style.display='flex';box.style.width='350px';box.querySelector('.btn-send-action').style.display='me'==='me'?'':'none';box.querySelectorAll('.action-tab').forEach(tab=>{tab.onclick=()=>{currentTab=tab.dataset.tab;box.querySelectorAll('.action-tab').forEach(t=>{t.style.color='#a7a9be';t.style.fontWeight='400';t.style.borderBottom='none'});tab.style.color='#6b5e7a';tab.style.fontWeight='500';tab.style.borderBottom='2px solid #6b5e7a';box.querySelector('.action-list').innerHTML=renderActionList(currentTab);box.querySelector('.btn-save-action').textContent=currentTab==='me'?'存我':'存TA';box.querySelector('.btn-send-action').style.display=currentTab==='me'?'':'none';bindActionItems()}});function bindActionItems(){box.querySelectorAll('.action-item').forEach(item=>{if(currentTab==='me'){item.style.cursor='pointer';item.style.opacity='1';item.onclick=(e)=>{if(e.target.classList.contains('action-del'))return;sendActionMessage(item.dataset.name,item.dataset.desc,'user');overlay.style.display='none'}}else{item.style.cursor='default';item.style.opacity='0.5';item.onclick=null}if(item.dataset.custom==='true'){let pressTimer;item.addEventListener('touchstart',(e)=>{pressTimer=setTimeout(async()=>{const idx=parseInt(item.dataset.index);const name=customInteractions[currentTab][idx].name;const ok=await showConfirm('删除互动',`确定要删除"${name}"吗？`);if(!ok)return;customInteractions[currentTab] function renderTeachingList(content,filter=''){const list=content.querySelector('.teaching-list');const items=filter?teachingLibrary.filter(t=>t.toLowerCase().includes(filter.toLowerCase())):teachingLibrary;list.innerHTML=items.map(t=>`<div class="teaching-item" data-content="${t}" style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:rgba(243,240,247,0.3);border-radius:10px"><span style="color:#3a3440;font-size:0.9rem;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t}</span><span class="teaching-delete" style="color:#a7a9be;cursor:pointer;font-size:0.85rem;flex-shrink:0;margin-left:8px">✕</span></div>`).join('');rebindTeachingItems(content)}
function bindTeachingEvents(c){c.querySelector('.search-teaching').oninput=e=>{const val=e.target.value.toLowerCase();c.querySelectorAll('.teaching-item').forEach(item=>{item.style.display=item.dataset.content.toLowerCase().includes(val)?'flex':'none'})};c.querySelector('.btn-import-teaching').onclick=()=>c.querySelector('.file-import-teaching').click();c.querySelector('.btn-export-teaching').onclick=()=>{const t=teachingLibrary.join('\n'),b=new Blob([t],{type:'text/plain'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='教学.txt';a.click();URL.revokeObjectURL(url)};c.querySelector('.file-import-teaching').onchange=async e=>{const f=e.target.files[0];if(!f)return;const t=await f.text(),lines=t.split('\n').map(l=>l.trim()).filter(l=>l.length>0),dups=lines.filter(l=>teachingLibrary.includes(l)),nc=lines.filter(l=>!teachingLibrary.includes(l));teachingLibrary.push(...nc);await dbSet('teachingLibrary',teachingLibrary);renderTeachingList(c);updateTeachingCount(c);if(dups.length>0)await showAlert('提示',`已跳过 ${dups.length} 条重复教学`);e.target.value=''};rebindTeachingItems(c)}
function updateTeachingCount(c){const el=c.querySelector('.teaching-count');if(el)el.textContent=`共 ${teachingLibrary.length} 条`}
function rebindTeachingItems(c){c.querySelectorAll('.teaching-item').forEach(item=>{item.querySelector('.teaching-delete').onclick=async()=>{const content=item.dataset.content;teachingLibrary=teachingLibrary.filter(t=>t!==content);await dbSet('teachingLibrary',teachingLibrary);renderTeachingList(c);updateTeachingCount(c)}})}

function doSelectChoice(){const qInput=document.getElementById('selectQuestion');const question=qInput.value.trim();if(!question)return;const validOptions=choiceOptions.map(o=>o.trim()).filter(o=>o.length>0);if(validOptions.length<2){showAlert('提示','至少需要两个选项');return}let selected=[];if(choiceMode==='single'){const idx=Math.floor(Math.random()*validOptions.length);selected=[{label:choiceLabels[idx],text:validOptions[idx]}]}else{const n=validOptions.length;const totalCombos=Math.pow(2,n)-1;const r=Math.floor(Math.random()*totalCombos)+1;for(let i=0;i<n;i++){if(r&(1<<i))selected.push({label:choiceLabels[i],text:validOptions[i]})}}const resultArea=document.getElementById('selectResult');const meAvatar=aboutMe.avatar?`background-image:url(${aboutMe.avatar});background-size:cover;background-position:center`:'';const himAvatar=aboutHim.avatar?`background-image:url(${aboutHim.avatar});background-size:cover;background-position:center`:'';const cardsHTML=selected.map(s=>{let bg,border;const idx=choiceLabels.indexOf(s.label);if(idx<4){bg=choiceDefaultColors[idx];border=choiceDefaultBorders[idx]}else{const ei=(idx-4)%choiceExtraColors.length;bg=choiceExtraColors[ei];border=choiceExtraBorders[ei]}return`<div class="choice-card-multi" style="background:${bg};border:2px solid ${border}"><span class="cm-label">${s.label}</span> ${s.text}</div>`}).join('');resultArea.innerHTML=`<div class="choice-result-row me"><div class="choice-result-bubble me">${question}</div><div class="choice-result-avatar me" style="${meAvatar}"></div></div><div class="choice-result-row partner"><div class="choice-result-avatar partner" style="${himAvatar}"></div><div class="choice-result-bubble partner">${cardsHTML}</div></div>`;choiceHistory.push({type:'choice',mode:choiceMode,question:question,options:validOptions,result:selected.map(s=>s.label+' '+s.text),timestamp:Date.now()});dbSet('choiceHistory',choiceHistory);qInput.value='';choiceOptions=['','','',''];renderSelectOptions()}
function bindChoiceEvents(){document.querySelectorAll('.choice-tab').forEach(tab=>{tab.addEventListener('click',()=>{choiceTab=tab.dataset.tab;document.querySelectorAll('.choice-tab').forEach(t=>t.classList.remove('active'));tab.classList.add('active');choiceOptions=[];choiceQuestion='';renderChoiceBody()})});document.getElementById('choiceOverlay').addEventListener('click',function(e){if(e.target===this)this.classList.remove('show')})}

let musicPlayer=null,musicCurrentIndex=-1,musicIsPlaying=!1,musicProgressInterval=null;
function openMusicPanel(){const overlay=document.getElementById('musicOverlay');document.getElementById('musicFloatWrap').classList.remove('show');const himAvatar=document.getElementById('musicAvatarHim');const meAvatar=document.getElementById('musicAvatarMe');if(aboutHim.avatar){himAvatar.style.backgroundImage=`url(${aboutHim.avatar})`;himAvatar.style.backgroundSize='cover';himAvatar.style.backgroundPosition='center'}else{himAvatar.style.backgroundImage='';himAvatar.style.backgroundColor='var(--mist-light)'}if(aboutMe.avatar){meAvatar.style.backgroundImage=`url(${aboutMe.avatar})`;meAvatar.style.backgroundSize='cover';meAvatar.style.backgroundPosition='center'}else{meAvatar.style.backgroundImage='';meAvatar.style.backgroundColor='var(--mist-purple)'}updateMusicCover();renderMusicSongList();overlay.classList.add('show')}
function updateMusicCover(){const cover=document.getElementById('musicCover');if(aboutMe.playlistCover){cover.style.backgroundImage=`url(${aboutMe.playlistCover})`;cover.style.backgroundSize='cover';cover.style.backgroundPosition='center'}else{cover.style.backgroundImage='';cover.style.backgroundColor='rgba(200,210,220,0.4)'}}
function parsePlaylistSongs(){return playlistLibrary.map(s=>{const parts=s.split('｜');if(parts.length>=2)return{name:parts[0].trim(),id:parts[1].trim()};const p2=s.split('|');if(p2.length>=2)return{name:p2[0].trim(),id:p2[1].trim()};return null}).filter(s=>s!==null)}
function renderMusicSongList(filter=''){const container=document.getElementById('musicSongList');const countEl=document.getElementById('musicCount');const songs=parsePlaylistSongs();const filtered=filter?songs.filter(s=>s.name.toLowerCase().includes(filter.toLowerCase())):songs;countEl.textContent=`共 ${filtered.length} 首`;container.innerHTML=filtered.map((s,i)=>{const globalIndex=songs.indexOf(s);return`<div class="music-song-item${globalIndex===musicCurrentIndex?' active':''}" data-index="${globalIndex}"><span class="music-song-name">${s.name}</span><span class="music-song-id">${s.id}</span></div>`}).join('');container.querySelectorAll('.music-song-item').forEach(item=>{item.addEventListener('click',()=>{const idx=parseInt(item.dataset.index);showMusicActionSheet(idx)})})}
function showMusicActionSheet(idx){const songs=parsePlaylistSongs();if(idx<0||idx>=songs.length)return;const song=songs[idx];const menu=document.createElement('div');menu.style.cssText='position:fixed;inset:0;background:rgba(58,52,64,0.3);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:60;display:flex;align-items:center;justify-content:center';menu.innerHTML=`<div style="width:260px;background:rgba(255,255,255,0.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:20px;border:1px solid rgba(196,187,209,0.3);padding:20px;text-align:center"><div style="font-size:0.95rem;color:#3a3440;font-weight:500;margin-bottom:6px">${song.name}</div><div style="font-size:0.75rem;color:#a7a9be;margin-bottom:16px">${song.id}</div><button class="dm-btn" style="margin-bottom:8px;width:100%;padding:14px;border-radius:16px;border:1px solid var(--border-light);background:rgba(243,240,247,0.5);color:var(--text-dark);font-size:0.95rem;cursor:pointer">▶ 在线播放</button><button class="dm-btn" style="width:100%;padding:14px;border-radius:16px;border:1px solid var(--border-light);background:rgba(243,240,247,0.5);color:var(--text-dark);font-size:0.95rem;cursor:pointer">☊ 跳转网易云</button></div>`;document.body.appendChild(menu);menu.addEventListener('click',function(e){if(e.target===menu||e.target.closest('button')){menu.remove()}});menu.querySelectorAll('button')[0].addEventListener('click',()=>{playSongAtIndex(idx);menu.remove()});menu.querySelectorAll('button')[1].addEventListener('click',()=>{window.open(`https://music.163.com/#/song?id=${song.id}`,'_blank');menu.remove()})}
function playSongAtIndex(idx){const songs=parsePlaylistSongs();if(idx<0||idx>=songs.length)return;musicCurrentIndex=idx;const song=songs[idx];if(musicPlayer){musicPlayer.pause();musicPlayer=null}clearInterval(musicProgressInterval);const url=`https://music.163.com/song/media/outer/url?id=${song.id}.mp3`;musicPlayer=new Audio(url);musicPlayer.play().then(()=>{musicIsPlaying=!0;updateMusicPlayIcon();startMusicProgress();updateMusicFloat()}).catch(()=>{showAlert('提示','播放失败，请尝试跳转网易云');musicIsPlaying=!1;updateMusicPlayIcon()});document.getElementById('musicNowPlaying').textContent=song.name;document.getElementById('musicProgressFill').style.width='0%';document.getElementById('musicProgressTime').textContent='00:00';renderMusicSongList();updateMusicCover()}
function toggleMusicPlay(){if(!musicPlayer)return;if(musicIsPlaying){musicPlayer.pause();musicIsPlaying=!1;clearInterval(musicProgressInterval);document.getElementById('musicCover').classList.add('paused');updateMusicPlayIcon();updateMusicFloatPlayIcon()}else{musicPlayer.play().then(()=>{musicIsPlaying=!0;startMusicProgress();document.getElementById('musicCover').classList.remove('paused');updateMusicPlayIcon();updateMusicFloatPlayIcon()}).catch(()=>{musicIsPlaying=!1;updateMusicPlayIcon();updateMusicFloatPlayIcon()})}}
function playMusicPrev(){if(!musicPlayer||musicCurrentIndex<=0)return;playSongAtIndex(musicCurrentIndex-1)}
function playMusicNext(){const songs=parsePlaylistSongs();if(!musicPlayer||musicCurrentIndex>=songs.length-1)return;playSongAtIndex(musicCurrentIndex+1)}
function startMusicProgress(){clearInterval(musicProgressInterval);document.getElementById('musicCover').classList.remove('paused');musicProgressInterval=setInterval(()=>{if(!musicPlayer||!musicIsPlaying)return;const dur=musicPlayer.duration;const cur=musicPlayer.currentTime;if(isNaN(dur))return;const pct=(cur/dur)*100;document.getElementById('musicProgressFill').style.width=pct+'%';const m=Math.floor(cur/60),s=Math.floor(cur%60);const timeStr=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;document.getElementById('musicProgressTime').textContent=timeStr;updateMusicFloatProgress(pct,timeStr)},500)}
function updateMusicPlayIcon(){const icon=document.getElementById('musicPlayIcon');if(!icon)return;icon.className=musicIsPlaying?'icon-music-pause':'icon-music-play'}
function updateMusicFloatPlayIcon(){const icon=document.getElementById('musicFloatPlayIcon');if(!icon)return;icon.className=musicIsPlaying?'icon-music-pause':'icon-music-play';if(musicIsPlaying){icon.style.cssText='width:14px;height:15px;border-left:5px solid var(--mist-purple);border-right:5px solid var(--mist-purple);border-top:none;border-bottom:none;transform:scale(0.55);margin-left:0'}else{icon.style.cssText='width:0;height:0;border-top:9px solid transparent;border-bottom:9px solid transparent;border-left:15px solid var(--mist-purple);margin-left:2px;transform:scale(0.55)'}}
function showMusicFloat(){if(document.getElementById('musicOverlay').classList.contains('show'))return;const wrap=document.getElementById('musicFloatWrap');wrap.classList.add('show');const songs=parsePlaylistSongs();if(musicCurrentIndex>=0&&musicCurrentIndex<songs.length){document.getElementById('musicFloatName').textContent=songs[musicCurrentIndex].name}updateMusicFloatPlayIcon();makeDraggable(wrap)}
function hideMusicFloat(){if(musicPlayer){musicPlayer.pause();musicIsPlaying=!1;clearInterval(musicProgressInterval)}document.getElementById('musicFloatWrap').classList.remove('show')}
function updateMusicFloat(){const songs=parsePlaylistSongs();if(musicCurrentIndex>=0&&musicCurrentIndex<songs.length){document.getElementById('musicFloatName').textContent=songs[musicCurrentIndex].name}updateMusicFloatPlayIcon()}
function updateMusicFloatProgress(pct,timeStr){document.getElementById('musicFloatProgressFill').style.width=pct+'%';document.getElementById('musicFloatTime').textContent=timeStr}
function bindMusicEvents(){document.getElementById('musicOverlay').addEventListener('click',function(e){if(e.target===this){this.classList.remove('show');if(musicIsPlaying)showMusicFloat()}});document.getElementById('musicPlayBtn').addEventListener('click',toggleMusicPlay);document.getElementById('musicPrev').addEventListener('click',playMusicPrev);document.getElementById('musicNext').addEventListener('click',playMusicNext);document.getElementById('musicSearch').addEventListener('input',e=>renderMusicSongList(e.target.value.toLowerCase()));document.getElementById('musicFloatClose').addEventListener('click',e=>{e.stopPropagation();hideMusicFloat();});document.getElementById('musicFloatPlay').addEventListener('click',e=>{e.stopPropagation();toggleMusicPlay();});document.getElementById('musicFloatPrev').addEventListener('click',e=>{e.stopPropagation();playMusicPrev();});document.getElementById('musicFloatNext').addEventListener('click',e=>{e.stopPropagation();playMusicNext();});document.getElementById('musicFloat').addEventListener('click',openMusicPanel)}

let noteColorIndex=0,lastNoteColorIdx=-1;
function getNextNoteColor(){let idx;do{idx=noteColorIndex%noteColors.length;noteColorIndex++;}while(idx===lastNoteColorIdx&&noteColors.length>1);lastNoteColorIdx=idx;dbSet('noteColorIndex',noteColorIndex);return noteColors[idx];}
function openNotePanel(){const overlay=document.getElementById('noteOverlay');const himAvatar=document.getElementById('noteAvatarHim');const meAvatar=document.getElementById('noteAvatarMe');if(aboutHim.avatar){himAvatar.style.backgroundImage=`url(${aboutHim.avatar})`;himAvatar.style.backgroundSize='cover';himAvatar.style.backgroundPosition='center'}else{himAvatar.style.backgroundImage='';himAvatar.style.backgroundColor='var(--mist-light)'}if(aboutMe.avatar){meAvatar.style.backgroundImage=`url(${aboutMe.avatar})`;meAvatar.style.backgroundSize='cover';meAvatar.style.backgroundPosition='center'}else{meAvatar.style.backgroundImage='';meAvatar.style.backgroundColor='var(--mist-purple)'}checkPendingReply();checkPendingAskReply();renderNoteList();updateNotePendingTexts();overlay.classList.add('show')}

function checkPendingAskReply(){if(!pendingAskReply)return;if(Date.now()-pendingAskReply.time>=pendingAskReply.delay){const reply=generatePartnerNoteReply();const color=getNextNoteColor();noteLibrary.push({content:reply,role:'partner',color:color,timestamp:Date.now()});dbSet('noteLibrary',noteLibrary);pendingAskReply=null;dbSet('pendingAskReply',null);renderNoteList();updateNotePendingTexts()}}
function generatePartnerNoteReply(){const pool=[...cardLibrary,...teachingLibrary];if(pool.length===0){const defaults=["我也在想你","晚安","今天也很想你","好梦","一直在","嗯嗯","等你","抱抱"];return defaults[Math.floor(Math.random()*defaults.length)]}const count=5+Math.floor(Math.random()*4);const parts=[];for(let i=0;i<count;i++){parts.push(pool[Math.floor(Math.random()*pool.length)])}return parts.map(p=>{if(/[。！？~…\.!\?]$/.test(p))return p;return p+'，'}).join('')}

rted.filter(s=>!stickerLibrary.includes(s));stickerLibrary.push(...ns);await dbSet('stickerLibrary',stickerLibrary);renderStickerGridDOM(content);updateStickerCount(content);if(ns.length<imported.length)await showAlert('提示',`已跳过 ${imported.length-ns.length} 个重复贴纸`)}}catch(err){await showAlert('提示','文件格式错误')}e.target.value=''};updateStickerActionsDOM(content)}

function bindGiftEvents(content){content.querySelector('.btn-add-gift').onclick=()=>showGiftModal(content);const actions=content.querySelector('#giftActions');actions.onclick=async e=>{const btn=e.target.closest('button');if(!btn)return;if(btn.classList.contains('btn-select-all-gift')){giftShowCheck=!0;const allSel=giftSel.size===giftLibrary.length;if(allSel)giftSel.clear();else giftLibrary.forEach((_,i)=>giftSel.add(i));renderGiftGridDOM(content);updateGiftActionsDOM(content)}else if(btn.classList.contains('btn-cancel-gift')){giftShowCheck=!1;giftSel.clear();renderGiftGridDOM(content);updateGiftActionsDOM(content)}else if(btn.classList.contains('btn-import-gift')){content.querySelector('.file-import-gift').click()}else if(btn.classList.contains('btn-export-gift')){const data=JSON.stringify(giftLibrary,null,2);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='礼物.json';a.click();URL.revokeObjectURL(url)}else if(btn.classList.contains('btn-delete-gift')){if(giftSel.size===0)return;const ok=await showConfirm('删除确认',`删除选中的 ${giftSel.size} 个礼物？`);if(!ok)return;const arr=[];giftLibrary.forEach((g,i)=>{if(!giftSel.has(i))arr.push(g)});giftLibrary=arr;giftSel.clear();giftShowCheck=!1;await dbSet('giftLibrary',giftLibrary);renderGiftGridDOM(content);updateGiftCount(content);updateGiftActionsDOM(content)}};content.querySelector('.file-import-gift').onchange=async e=>{const f=e.target.files[0];if(!f)return;const t=await f.text();try{const imported=JSON.parse(t);if(Array.isArray(imported)){const ns=imported.filter(s=>!giftLibrary.some(g=>g.name===s.name&&g.icon===s.icon));giftLibrary.push(...ns);await dbSet('giftLibrary',giftLibrary);renderGiftGridDOM(content);updateGiftCount(content);if(ns.length<imported.length)await showAlert('提示',`已跳过 ${imported.length-ns.length} 个重复礼物`)} }catch(err){await showAlert('提示','文件格式错误')}e.target.value=''};updateGiftActionsDOM(content)}
function updateGiftActionsDOM(content){const actions=content.querySelector('#giftActions');if(giftShowCheck){actions.innerHTML=`<button class="btn-select-all-gift" style="flex:1;padding:10px;border:1px solid rgba(196,187,209,0.3);border-radius:10px;background:rgba(243,240,247,0.3);color:#6b5e7a;font-size:0.8rem;white-space:nowrap">全选</button><button class="btn-cancel-gift" style="flex:1;padding:10px;border:1px solid rgba(196,187,209,0.3);border-radius:10px;background:rgba(243,240,247,0.3);color:#6b5e7a;font-size:0.8rem;white-space:nowrap">取消</button><button class="btn-import-gift" style="flex:1;padding:10px;border:1px solid rgba(196,187,209,0.3);border-radius:10px;background:rgba(243,240,247,0.3);color:#6b5e7a;font-size:0.8rem;white-space:nowrap">导入</button><button class="btn-export-gift" style="flex:1;padding:10px;border:1px solid rgba(196,187,209,0.3);border-radius:10px;background:rgba(243,240,247,0.3);color:#6b5e7a;font-size:0.8rem;white-space:nowrap">导出</button><button class="btn-delete-gift" style="flex:1;padding:10px;border:1px solid rgba(196,187,209,0.3);border-radius:10px;background:rgba(243,240,247,0.3);color:#a7a9be;font-size:0.8rem;white-space:nowrap">删除选中</button>`}else{actions.innerHTML=`<button class="btn-select-all-gift" style="flex:1;padding:10px;border:1px solid rgba(196,187,209,0.3);border-radius:10px;background:rgba(243,240,247,0.3);color:#6b5e7a;font-size:0.8rem;white-space:nowrap">全选</button><button class="btn-cancel-gift" style="flex:1;padding:10px;border:1px solid rgba(196,187,209,0.3);border-radius:10px;background:rgba(243,240,247,0.3);color:#6b5e7a;font-size:0.8rem;white-space:nowrap">取消</button><button class="btn-import-gift" style="flex:1;padding:10px;border:1px solid rgba(196,187,209,0.3);border-radius:10px;background:rgba(243,240,247,0.3);color:#6b5e7a;font-size:0.8rem;white-space:nowrap">导入</button><button class="btn-export-gift" style="flex:1;padding:10px;border:1px solid rgba(196,187,209,0.3);border-radius:10px;background:rgba(243,240,247,0.3);color:#6b5e7a;font-size:0.8rem;white-space:nowrap">导出</button>`}}
function updateGiftCount(content){const el=content.querySelector('.gift-count');if(el)el.textContent=`共 ${giftLibrary.length} 个`}
function rebindGiftItemsDOM(content){content.querySelectorAll('.gift-item').forEach(item=>{const idx=parseInt(item.dataset.index);const check=item.querySelector('.gift-check');if(check){check.onclick=ev=>{ev.stopPropagation();if(giftSel.has(idx)){giftSel.delete(idx);check.textContent='□'}else{giftSel.add(idx);check.textContent='☑'}}}item.onclick=(ev)=>{if(ev.target.closest('.gift-check'))return;if(giftShowCheck)return;showGiftEditModal(idx,content)}});content.querySelectorAll('.gift-del').forEach(btn=>{btn.onclick=async ev=>{ev.stopPropagation();const idx=parseInt(btn.dataset.idx);const ok=await showConfirm('删除确认',`删除"${giftLibrary[idx].name}"？`);if(!ok)return;giftLibrary.splice(idx,1);giftSel.delete(idx);await dbSet('giftLibrary',giftLibrary);renderGiftGridDOM(content);updateGiftCount(content)}})}
function showGiftModal(content){const overlay=document.getElementById('modalOverlay');const box=document.getElementById('modalBox');let giftImageData=null;box.innerHTML=`<div style="font-size:1rem;color:#3a3440;font-weight:500;margin-bottom:16px">添加礼物</div><div style="text-align:left;margin-bottom:10px"><div style="font-size:0.8rem;color:#6b5e7a;margin-bottom:4px">图标</div><div style="display:flex;gap:8px;align-items:center"><input class="modal-input" id="giftIconInput" placeholder="输入Emoji或上传图片" value="" style="flex:1;margin-bottom:0"><button class="btn-gift-upload" style="width:40px;height:40px;border-radius:10px;background:rgba(107,94,122,0.12);border:1px solid rgba(107,94,122,0.3);color:#6b5e7a;font-size:1.2rem;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;align-self:flex-start">📷</button></div></div><div style="text-align:left;margin-bottom:10px"><div style="font-size:0.8rem;color:#6b5e7a;margin-bottom:4px">礼物名称</div><input class="modal-input" id="giftNameInput" placeholder="如：花" value=""></div><div style="text-align:left;margin-bottom:10px"><div style="font-size:0.8rem;color:#6b5e7a;margin-bottom:4px">描述</div><input class="modal-input" id="giftDescInput" placeholder="如：送你一朵小花" value=""></div><div style="text-align:center;margin-bottom:14px"><div style="font-size:0.75rem;color:#a7a9be;margin-bottom:8px">预览</div><div style="display:inline-flex;flex-direction:column;align-items:center;padding:16px 20px;background:rgba(243,240,247,0.4);border-radius:16px;border:1px solid rgba(196,187,209,0.25);min-width:100px"><div id="giftPreviewIcon" style="font-size:2.5rem;line-height:1.2;margin-bottom:6px">❓</div><div id="giftPreviewName" style="font-size:0.9rem;color:#3a3440;font-weight:500;margin-bottom:2px">礼物名称</div><div id="giftPreviewDesc" style="font-size:0.7rem;color:#a7a9be">描述文字</div></div></div><button class="btn-save-gift" style="width:100%;padding:12px;background:#6b5e7a;color:#fff;border:none;border-radius:14px;font-size:0.95rem">保存礼物</button><input type="file" class="file-gift-icon" accept="image/*" style="display:none">`;overlay.style.display='flex';const iconInput=box.querySelector('#giftIconInput');const nameInput=box.querySelector('#giftNameInput');const descInput=box.querySelector('#giftDescInput');const previewIcon=box.querySelector('#giftPreviewIcon');const previewName=box.querySelector('#giftPreviewName');const previewDesc=box.querySelector('#giftPreviewDesc');const fileInput=box.querySelector('.file-gift-icon');function updatePreview(){const name=nameInput.value.trim()||'礼物名称';const desc=descInput.value.trim()||'描述文字';previewName.textContent=name;previewDesc.textContent=desc;if(giftImageData){previewIcon.innerHTML=`<img src="${giftImageData}" style="width:50px;height:50px;object-fit:contain;border-radius:8px">`}else{const icon=iconInput.value.trim()||'❓';previewIcon.textContent=icon;previewIcon.innerHTML=icon}}iconInput.addEventListener('input',()=>{if(iconInput.value.trim()){giftImageData=null}updatePreview()});nameInput.addEventListener('input',updatePreview);descInput.addEventListener('input',updatePreview);box.querySelector('.btn-gift-upload').onclick=()=>fileInput.click();fileInput.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{giftImageData=ev.target.result;iconInput.value='';updatePreview()};r.readAsDataURL(f);e.target.value=''};box.querySelector('.btn-save-gift').onclick=async()=>{const icon=giftImageData||iconInput.value.trim();const name=nameInput.value.trim();const desc=descInput.value.trim();if(!icon||!name){await showAlert('提示','图标和名称不能为空');return}giftLibrary.push({name,icon,desc:desc||name});await dbSet('giftLibrary',giftLibrary);renderGiftGridDOM(content);updateGiftCount(content);overlay.style.display='none'};overlay.onclick=e=>{if(e.target===overlay)overlay.style.display='none'};setTimeout(()=>iconInput.focus(),300);updatePreview()}
function showGiftEditModal(idx,content){const overlay=document.getElementById('modalOverlay');const box=document.getElementById('modalBox');const gift=giftLibrary[idx];let giftImageData=gift.icon.startsWith('data:')?gift.icon:null;box.innerHTML=`<div style="font-size:1rem;color:#3a3440;font-weight:500;margin-bottom:16px">编辑礼物</div><div style="text-align:left;margin-bottom:10px"><div style="font-size:0.8rem;color:#6b5e7a;margin-bottom:4px">图标</div><div style="display:flex;gap:8px;align-items:center"><input class="modal-input" id="giftIconInput" placeholder="输入Emoji或上传图片" value="${giftImageData?'':gift.icon}" style="flex:1;margin-bottom:0"><button class="btn-gift-upload" style="width:40px;height:40px;border-radius:10px;background:rgba(107,94,122,0.12);border:1px solid rgba(107,94,122,0.3);color:#6b5e7a;font-size:1.2rem;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;align-self:flex-start">📷</button></div></div><div style="text-align:left;margin-bottom:10px"><div style="font-size:0.8rem;color:#6b5e7a;margin-bottom:4px">礼物名称</div><input class="modal-input" id="giftNameInput" value="${gift.name}"></div><div style="text-align:left;margin-bottom:10px"><div style="font-size:0.8rem;color:#6b5e7a;margin-bottom:4px">描述</div><input class="modal-input" id="giftDescInput" value="${gift.desc||''}"></div><div style="text-align:center;margin-bottom:14px"><div style="font-size:0.75rem;color:#a7a9be;margin-bottom:8px">预览</div><div style="display:inline-flex;flex-direction:column;align-items:center;padding:16px 20px;background:rgba(243,240,247,0.4);border-radius:16px;border:1px solid rgba(196,187,209,0.25);min-width:100px"><div id="giftPreviewIcon" style="font-size:2.5rem;line-height:1.2;margin-bottom:6px">${giftImageData?`<img src="${giftImageData}" style="width:50px;height:50px;object-fit:contain;border-radius:8px">`:gift.icon}</div><div id="giftPreviewName" style="font-size:0.9rem;color:#3a3440;font-weight:500;margin-bottom:2px">${gift.name}</div><div id="giftPreviewDesc" style="font-size:0.7rem;color:#a7a9be">${gift.desc||''}</div></div></div><button class="btn-save-gift" style="width:100%;padding:12px;background:#6b5e7a;color:#fff;border:none;border-radius:14px;font-size:0.95rem">保存修改</button><input type="file" class="file-gift-icon" accept="image/*" style="display:none">`;overlay.style.display='flex';const iconInput=box.querySelector('#giftIconInput');const nameInput=box.querySelector('#giftNameInput');const descInput=box.querySelector('#giftDescInput');const previewIcon=box.querySelector('#giftPreviewIcon');const previewName=box.querySelector('#giftPreviewName');const previewDesc=box.querySelector('#giftPreviewDesc');const fileInput=box.querySelector('.file-gift-icon');function updatePreview(){previewName.textContent=nameInput.value.trim()||'礼物名称';previewDesc.textContent=descInput.value.trim()||'描述文字';if(giftImageData){previewIcon.innerHTML=`<img src="${giftImageData}" style="width:50px;height:50px;object-fit:contain;border-radius:8px">`}else{previewIcon.textContent=iconInput.value.trim()||'❓'}}iconInput.addEventListener('input',()=>{if(iconInput.value.trim())giftImageData=null;updatePreview()});nameInput.addEventListener('input',updatePreview);descInput.addEventListener('input',updatePreview);box.querySelector('.btn-gift-upload').onclick=()=>fileInput.click();fileInput.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{giftImageData=ev.target.result;iconInput.value='';updatePreview()};r.readAsDataURL(f)};box.querySelector('.btn-save-gift').onclick=async()=>{const icon=giftImageData||iconInput.value.trim();const name=nameInput.value.trim();const desc=descInput.value.trim();if(!icon||!name){await showAlert('提示','图标和名称不能为空');return}giftLibrary[idx]={name,icon,desc:desc||name};await dbSet('giftLibrary',giftLibrary);renderGiftGridDOM(content);updateGiftCount(content);overlay.style.display='none'};overlay.onclick=e=>{if(e.target===overlay)overlay.style.display='none'};setTimeout(()=>iconInput.focus(),300)}

/* ===== 功能卡片 ===== */
const functionCards=[{name:'信件',icon:'envelope',size:'lg',emoji:null},{name:'留言笺',icon:'message',size:'lg',emoji:null},{name:'音乐',icon:'music',size:'md',emoji:'♫'},{name:'抉择',icon:'choice',size:'md',emoji:'⚅'},{name:'私教',icon:'teach',size:'sm',emoji:null},{name:'纪念日',icon:'anniversary',size:'sm',emoji:null},{name:'数据统计',icon:'stats',size:'sm',emoji:null},{name:'数据管理',icon:'cloud',size:'md',emoji:null},{name:'恋人空间',icon:'loverSpace',size:'lg',emoji:'♥'}];
let functionOpen=!1;
function getCardIcon(card){if(card.emoji){return`<div class="fc-emoji">${card.emoji}</div>`}const map={envelope:`<div class="fc-icon"><svg viewBox="0 0 24 24" width="32" height="32"><rect x="3" y="6" width="18" height="12" rx="2" fill="#6b5e7a"/><line x1="5" y1="8" x2="12" y2="14" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/><line x1="19" y1="8" x2="12" y2="14" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/></svg></div>`,message:'<div class="fc-icon"><div class="icon-css-message"></div></div>',teach:'<div class="fc-icon"><div class="icon-css-teach"></div></div>',anniversary:'<div class="fc-icon"><div class="icon-css-anniversary"></div></div>',stats:'<div class="fc-icon"><div class="icon-css-stats"></div></div>',cloud:'<div class="fc-icon"><div class="icon-css-cloud"></div></div>'};return map[card.icon]||'';}
function bindFunctionEvents(){const fab=document.getElementById('globalFab');const backdrop=document.getElementById('functionBackdrop');const cardsContainer=document.getElementById('functionCards');fab.addEventListener('click',e=>{functionOpen=!functionOpen;if(functionOpen){renderFunctionCards();cardsContainer.classList.add('show');backdrop.classList.add('show')}else{cardsContainer.classList.remove('show');backdrop.classList.remove('show')}});backdrop.addEventListener('click',()=>{functionOpen=!1;cardsContainer.classList.remove('show');backdrop.classList.remove('show')})}
function renderFunctionCards(){const container=document.getElementById('functionCards');container.innerHTML='';functionCards.forEach((card,i)=>{const el=document.createElement('div');el.className=`function-card card-${card.size}`;el.innerHTML=`${getCardIcon(card)}<span class="fc-label">${card.name}</span>`;const delay=i*50;setTimeout(()=>{el.classList.add('show');positionFunctionCard(el,i)},50+delay);el.addEventListener('click',()=>handleFunctionClick(card));container.appendChild(el)})}
function positionFunctionCard(el,i){const positions=[{right:0,bottom:70},{right:120,bottom:55},{right:10,bottom:180},{right:10,bottom:300},{right:130,bottom:175},{right:210,bottom:70},{right:210,bottom:200},{right:100,bottom:290},{right:180,bottom:310}];const pos=positions[i]||positions[0];el.style.right=pos.right+'px';el.style.bottom=pos.bottom+'px';el.style.transform='translate(0,0) scale(1)';const colors=['rgba(200,210,240,0.85)','rgba(220,200,230,0.85)','rgba(190,220,215,0.85)','rgba(235,210,195,0.85)','rgba(210,225,200,0.85)','rgba(240,215,220,0.85)','rgba(200,215,235,0.85)','rgba(225,220,200,0.85)','rgba(255,200,210,0.85)'];el.style.background=colors[i]||colors[0]}
function handleFunctionClick(card){const backdrop=document.getElementById('functionBackdrop');const cardsContainer=document.getElementById('functionCards');functionOpen=!1;cardsContainer.classList.remove('show');backdrop.classList.remove('show');if(card.name==='私教'){openTeachPanel()}else if(card.name==='抉择'){openChoicePanel()}else if(card.name==='音乐'){openMusicPanel()}else if(card.name==='留言笺'){openNotePanel()}else if(card.name==='信件'){openLetterPanel()}else if(card.name==='纪念日'){openAnniversaryPanel()}else if(card.name==='数据管理'){openDataManage()}else if(card.name==='数据统计'){openStatsPanel()}else if(card.name==='恋人空间'){if(spaceActivated){openSpacePanel()}else{showAlert('提示','恋人空间尚未激活，在聊天中等待TA的邀请吧')}}else{showAlert('提示',`${card.name} · 待开发`)}}

/* ===== 恋人空间核心 ===== */
function getTodayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function getSpaceDays(){if(!spaceActivatedDate)return 0;const d1=new Date(spaceActivatedDate+'T00:00:00');const d2=new Date();const today=new Date(d2.getFullYear(),d2.getMonth(),d2.getDate());return Math.floor((today-d1)/(1000*60*60*24))+1}

function showSpaceInvite(){const overlay=document.getElementById('spaceInviteOverlay');const card=document.getElementById('spaceInviteCard');const himAvatar=aboutHim.avatar?`background-image:url(${aboutHim.avatar});background-size:cover;background-position:center`:'';const meAvatar=aboutMe.avatar?`background-image:url(${aboutMe.avatar});background-size:cover;background-position:center`:'';const himName=aboutHim.name||'易遇';card.innerHTML=`<div class="space-invite-avatars"><div class="si-avatar him" style="${himAvatar}"></div><div class="si-avatar me" style="${meAvatar}"></div></div><div class="space-invite-title">${himName}想和你建立情侣关系</div><div class="space-invite-subtitle">${himName}</div><div class="space-invite-subtitle">想和你成为情侣</div><div class="space-invite-text">和我成为情侣，让我们一起记录每日点滴。</div><button class="btn-space-primary" id="btnSpaceAccept">我愿意</button>`;overlay.classList.add('show');card.querySelector('#btnSpaceAccept').onclick=()=>{overlay.classList.remove('show');showSpaceActivated()}}

function exportChatRecords(){const text=messages.map(m=>{const d=new Date(m.timestamp);const time=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;let roleTag=m.role==='user'?'我':m.role==='partner'?aboutHim.nickname||aboutHim.name||'他':'系统';let content=m.content||'';if(m.type==='action')content=`[${m.content}] ${m.description||''}`;if(m.type==='gift')content=`[礼物] ${m.description||m.content}`;if(m.type==='image')content='[图片]';if(m.type==='sticker')content='[贴纸]';if(m.type==='call')content=`[通话] ${m.content}`;return `${time} ${roleTag}: ${content}`}).join('\n');const blob=new Blob([text],{type:'text/plain'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;const n=new Date();a.download=`聊天记录_${n.getFullYear()}${String(n.getMonth()+1).padStart(2,'0')}${String(n.getDate()).padStart(2,'0')}.txt`;a.click();URL.revokeObjectURL(url)}
